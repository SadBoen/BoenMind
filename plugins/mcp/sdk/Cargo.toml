[package]
name = "boenmind-plugin-sdk"
version = "0.1.0"
edition = "2021"
description = "BoenMind 插件协议最小 SDK:MCP 2024-11-05 / JSON-RPC 2.0 over stdio"
license = "Apache-2.0"

[lib]
name = "boenmind_plugin_sdk"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

# issue #75:本 crate 不在 runtime workspace 内(随包第三方言分发,独立构建),
# 无法继承 workspace.lints;此处显式对齐 workspace 的 clippy 口径,使 SDK 自身
# 编译面与 workspace 一致(CI plugin-sdk job 已跑 clippy --all-targets -D warnings)。
[lints.clippy]
all = { level = "warn", priority = -1 }
