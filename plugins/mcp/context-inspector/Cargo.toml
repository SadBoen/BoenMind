[package]
name = "context-inspector-rs"
version = "0.1.0"
edition = "2021"
description = "BoenMind 官方自带大模型交互透视与诊断分析 MCP 插件"
license = "Apache-2.0"

[[bin]]
name = "context-inspector"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time", "sync", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
opt-level = 3
codegen-units = 1
