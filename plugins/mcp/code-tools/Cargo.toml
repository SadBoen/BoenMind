[package]
name = "code-tools-rs"
version = "0.1.0"
edition = "2021"
description = "code-tools MCP server:查/读/改代码工具面,rg 引擎(grep-searcher/regex)内嵌,allowed_roots 沙箱,单 exe 零运行时依赖"

[[bin]]
name = "code-tools"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
grep-searcher = "0.1"
grep-regex = "0.1"
walkdir = "2"
regex = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["process"] }

[profile.release]
strip = true
lto = true
