[package]
name = "web-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust 协议兼容层：dsh 前端接口合同 9 面 + 双栅栏（v2 计划 §三）"

[dependencies]
kernel-contracts = { path = "../../kernel/kernel-contracts" }
kernel-session = { path = "../../kernel/kernel-session" }
bm-assembly = { path = "../assembly" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio-tungstenite = "0.24"
tower-http = { version = "0.6", features = ["fs"] }
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
uuid.workspace = true
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
async-trait.workspace = true
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
