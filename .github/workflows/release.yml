name: release

# Linux 服务器发布线(Linux x86_64 .tar.gz)。仅 v* tag 触发——原
# workflow_dispatch 手动触发曾产出 boenmind-main-* 包(P1-41 已修,
# 触发器随之删除:手动点跑只会全 job 跳过,留之误导)。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-linux:
    # P1-41(2026-09-07 架构评审):仅 v* tag 触发才打包发版——手动
    # workflow_dispatch 时 GITHUB_REF_NAME=main,曾会产出 boenmind-main-*
    # 包并以 main 为 tag 建 Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            runtime
            plugins/mcp/web-multisearch
            plugins/mcp/context-inspector
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runtime/webapp/package-lock.json

      - name: 前端构建(dist 入包)
        working-directory: runtime/webapp
        run: |
          npm ci
          npm run build

      # 插件进发布包前先过全量测试(测试挂了不发版)
      - name: 插件测试门禁
        working-directory: plugins/mcp/web-multisearch
        run: cargo test

      - name: 插件测试门禁(context-inspector)
        working-directory: plugins/mcp/context-inspector
        run: cargo test

      - name: 服务器构建
        working-directory: runtime
        run: cargo build --release --bin boenmind-server

      - name: 插件构建
        working-directory: plugins/mcp/web-multisearch
        run: cargo build --release

      - name: 插件构建(context-inspector)
        working-directory: plugins/mcp/context-inspector
        run: cargo build --release

      - name: 打包(Linux)
        run: |
          VER="${GITHUB_REF_NAME#v}"
          PKG="boenmind-${VER}-linux-x86_64"
          mkdir -p "${PKG}/webapp" "${PKG}/plugins" "${PKG}/apps"
          cp runtime/target/release/boenmind-server "${PKG}/"
          cp -r runtime/webapp/dist "${PKG}/webapp/dist"
          cp plugins/mcp/web-multisearch/target/release/web-multisearch "${PKG}/plugins/"
          cp plugins/mcp/web-multisearch/README.md "${PKG}/plugins/web-multisearch-README.md"
          cp plugins/mcp/context-inspector/target/release/context-inspector "${PKG}/plugins/"
          cp plugins/mcp/context-inspector/README.md "${PKG}/plugins/context-inspector-README.md"
          # ADR-0023:官方随包清单(声明名)——升级换装后服务端据此标记
          # 「官方最新版已不随包」的存量插件(建议删除)
          cp plugins/official-plugins.json "${PKG}/plugins/.official.json"
          # 官方随包 App:只打包三个生产 demo server + 协议 SDK,排除 CI 门禁
          # smoke_test.py / mcp_sdk_test.py(mcp_sdk.py 是三 server 的运行期依赖)
          cp apps/wiki_server.py apps/market_server.py apps/music_server.py "${PKG}/apps/" 2>/dev/null || true
          cp apps/mcp_sdk.py "${PKG}/apps/" 2>/dev/null || true
          cp apps/mcp-config.example.json "${PKG}/apps/" 2>/dev/null || true
          cp packaging/INSTALL.md "${PKG}/INSTALL.md" 2>/dev/null || true
          test -x "${PKG}/plugins/web-multisearch"
          test -x "${PKG}/plugins/context-inspector"
          tar czf "${PKG}.tar.gz" "${PKG}"
          ls -la "${PKG}.tar.gz"
          # 升级客户端按 <资产名>.sha256 拉取校验文件(about.rs;首 token=hex)
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
          sha256sum "${PKG}.tar.gz" > SHA256SUMS.txt

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            boenmind-*.tar.gz boenmind-*.tar.gz.sha256 SHA256SUMS.txt \
            --title "BoenMind ${GITHUB_REF_NAME}" \
            --notes "BoenMind ${GITHUB_REF_NAME} (Linux x86_64).

          包含:
          - boenmind-server: AI OS / Runtime 服务器核心(内置 fs.* 文件工具集:fs.search/fs.read 直通,fs.write/fs.edit 审批,rg 引擎内嵌)
          - webapp/dist: 最新 Web UI 预构建前端 (含音乐播放器、多角色管理、上下文透视、MCP 管理与完整热插拔等)
          - plugins/web-multisearch: 官方自带聚合搜索 MCP 插件
          - plugins/context-inspector: 官方自带上下文透视与分析 MCP 插件
          - apps/: 包含音乐播放器 (music_server.py)、Wiki (wiki_server.py)、Market (market_server.py) 等首批真实 App

          支持在网页端 设置 -> 关于 中执行一键在线升级。"
