# BoenMind 发布流程：打 tag v* 自动构建四类产物并创建 GitHub Release
#   - macOS Apple Silicon（dmg + app.tar.gz + 自动更新签名；v0.1.2 起不发布 Intel 版）
#   - Windows 便携版（zip，免安装）
#   - Linux 服务器版（单文件二进制 tar.gz，x86_64 + aarch64）
#   - Docker 多架构镜像（ghcr.io/sadboen/boenmind）
# 也可 workflow_dispatch 手动触发试跑（不创建 Release、不推 Docker）。
#
# 前置条件（一次性）：仓库 Secrets 添加
#   TAURI_SIGNING_PRIVATE_KEY        = base64 ~/.boenmind/tauri-update.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# 没有这两个 Secret 时 macOS job 会失败（createUpdaterArtifacts 需要签名）。

name: Release

on:
  push:
    branches: ["main"] # 日常 push 只跑质量门（4 并行 job）
    tags: ["v*"]       # 打 tag 全量构建发布
  workflow_dispatch: {}

# 同一 ref 连续 push 时取消旧轮（质量门只看最新提交；避免多轮排队全跑浪费）。
# tag ref 与 main 的 group 不同，不影响发布构建。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11"

jobs:
  # ============================================================
  # 改动检测：按路径决定质量门哪些 job 需要跑（纯 docs 提交跳过
  # Rust 编译，省 20 分钟空转）。workflow_dispatch / tag 时无 base
  # diff，paths-filter 保守按"全改动"处理 → 质量门全跑。
  # ============================================================
  changes:
    name: 改动检测
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/**'
            frontend:
              - 'frontend/**'
              - '.github/**'

  # ============================================================
  # 质量门：后端测试 / 后端 clippy（-D warnings）/ 前端 strict 类型检查 + lint。
  # 拆 4 个并行 job（无 needs 依赖）：push main 全跑，任一红即拦；
  # 打 tag / 手动触发时与构建链并行，不阻塞发布构建。
  # 构建前拦截回归（曾出现 0 测试、CI 只验证"能编译"的问题）。
  # 纯 docs 提交时 Rust job 经 changes 检测跳过。
  # ============================================================
  # ---------- quality-test：后端测试 ----------
  quality-test:
    name: 质量门 - 后端测试
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # 磁盘治理：pi 引擎依赖树极重（swc/tree-sitter 等 500+），曾报
    # No space left on device。质量门不需要调试符号：dev profile 关 debuginfo
    # + 关增量缓存，体积降 ~60%。
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      # sccache 不自动接管 cargo（README 要求显式声明）：
      # RUSTC_WRAPPER = 让 cargo 的 rustc 调用走 sccache 拦截；
      # SCCACHE_GHA_ENABLED = GHA cache backend（跨 job/run 共享）。
      # 缺任一 = sccache stats 0 请求（2026-08-15 实证，见交接 §〇·五 34）
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # 钉 v2.9.1：浮动 v2 会解析到基于 Node 20 运行时的新版（Node 20 已 EOL，runner 侧报错）
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: backend

      # sccache：对象级编译缓存（按编译单元），覆盖 rust-cache 整目录快照
      # 覆盖不到的依赖（实测 rust-cache 命中仅 ~879MB，依赖树 debug 产物
      # 10GB+，每轮仍重编大部分依赖 → test 20min）。GHA backend 经
      # actions/cache 存取，跨 job 共享。
      - name: sccache（对象级编译缓存）
        uses: mozilla/sccache-action@v0.0.11
        env:
          SCCACHE_GHA_CACHE_SIZE: "2G"

      # bm-compactor / bm-memory 为 2026-08 补进：两 crate 有 lib 测试 +
      # tests/architecture.rs（架构红线），此前 CI 从未覆盖；`cargo test -p`
      # 默认连带 integration tests 一起跑，架构测试随本行覆盖。
      - name: 后端测试
        working-directory: backend
        run: cargo test -p bm-core -p bm-server -p bm-protocol -p bm-kernel -p bm-storage-turso -p bm-loop -p bm-event-log-tests -p bm-compactor -p bm-memory

      # bm-compat 单独一行：其 lib test 目标包含 vendored 6 文件的 upstream
      # mod tests（B1 遗留 TODO，见 crates/bm-compat/README.md），故只跑
      # B2/B3/B4/B6 事件分发的集成测试目标（--test 参数不能与其他 -p 混用）。
      - name: 后端测试（bm-compat host/load/execute/events 集成）
        working-directory: backend
        run: cargo test -p bm-compat --test host --test load --test execute --test events --test session

  # ---------- quality-clippy：存量 crate（编译最重的一档，单独成 job） ----------
  quality-clippy:
    name: 质量门 - 后端 clippy（存量）
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # 同 quality-test 的磁盘治理：clippy 也整树编译一遍，同样关 debuginfo + 增量缓存。
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      # sccache 不自动接管 cargo（README 要求显式声明）：
      # RUSTC_WRAPPER = 让 cargo 的 rustc 调用走 sccache 拦截；
      # SCCACHE_GHA_ENABLED = GHA cache backend（跨 job/run 共享）。
      # 缺任一 = sccache stats 0 请求（2026-08-15 实证，见交接 §〇·五 34）
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # 钉 v2.9.1：浮动 v2 会解析到基于 Node 20 运行时的新版（Node 20 已 EOL，runner 侧报错）
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: backend

      - name: sccache（对象级编译缓存）
        uses: mozilla/sccache-action@v0.0.11
        env:
          SCCACHE_GHA_CACHE_SIZE: "2G"

      - name: clippy（-D warnings，存量 crate）
        working-directory: backend
        run: cargo clippy -p bm-core -p bm-server --lib --no-deps -- -D warnings

  # ---------- quality-clippy-kernel：内核四件套 + bm-compat ----------
  quality-clippy-kernel:
    name: 质量门 - 后端 clippy（内核 + bm-compat）
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # 同 quality-test 的磁盘治理：clippy 也整树编译一遍，同样关 debuginfo + 增量缓存。
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      # sccache 不自动接管 cargo（README 要求显式声明）：
      # RUSTC_WRAPPER = 让 cargo 的 rustc 调用走 sccache 拦截；
      # SCCACHE_GHA_ENABLED = GHA cache backend（跨 job/run 共享）。
      # 缺任一 = sccache stats 0 请求（2026-08-15 实证，见交接 §〇·五 34）
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # 钉 v2.9.1：浮动 v2 会解析到基于 Node 20 运行时的新版（Node 20 已 EOL，runner 侧报错）
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: backend

      - name: sccache（对象级编译缓存）
        uses: mozilla/sccache-action@v0.0.11
        env:
          SCCACHE_GHA_CACHE_SIZE: "2G"

      # 内核四件套 --all-targets 全开；bm-compactor / bm-memory 2026-08 补进，
      # 此前 CI 从未 lint（--all-targets 连带 tests/architecture.rs 架构红线）。
      - name: clippy（-D warnings，内核四件套）
        working-directory: backend
        run: cargo clippy -p bm-protocol -p bm-kernel -p bm-storage-turso -p bm-loop -p bm-event-log-tests -p bm-compactor -p bm-memory --all-targets --no-deps -- -D warnings

      # bm-compat：lib + B2/B3/B4/B6 事件分发集成测试。B1 拷入文件的存量 lint 已在
      # manifest [lints] 表放行（红线：拷贝文件逐字节一致），新代码仍受 -D warnings。
      - name: clippy（-D warnings，bm-compat）
        working-directory: backend
        run: cargo clippy -p bm-compat --lib --test host --test load --test execute --test events --test session --no-deps -- -D warnings

  # ---------- quality-frontend：前端 strict 类型检查 + lint ----------
  quality-frontend:
    name: 质量门 - 前端 (strict 类型检查 + lint)
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 前端类型检查（strict）
        working-directory: frontend
        run: pnpm exec tsc -b

      - name: 前端 lint
        working-directory: frontend
        run: pnpm lint

  # ============================================================
  # macOS：Apple Silicon（v0.1.2 起取消 Intel 构建——用户明确要求）
  # ============================================================
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    # 日常 push main 只跑质量门；构建/发布仅在打 tag 或手动触发
    # 说明：v0.1.2 起不再发布 Intel (x86_64) 版（用户明确要求；Intel Mac 可继续用 v0.1.1）
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: 安装前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 构建 Apple Silicon 版 (aarch64)
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 无 Apple 开发者证书：ad-hoc 签名（未 notarize，首次打开需右键）
          TAURI_SIGNING_IDENTITY: "-"
        run: pnpm tauri build --target aarch64-apple-darwin --bundles app,dmg

      # tauri build 只产 app 壳；bm-server 是独立 workspace crate，
      # 二进制需显式构建（热升级 runtime 资产用）
      # embed-plugins：内置插件内嵌进二进制（用户机器无仓库路径，普通构建预装失效）
      - name: 构建 bm-server runtime 二进制
        working-directory: backend
        run: cargo build --release -p bm-server --target aarch64-apple-darwin --features embed-plugins

      - name: 收集产物并生成自动更新清单 (latest.json)
        working-directory: frontend
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euxo pipefail
          mkdir -p ../dist-mac
          VER="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          # 试跑（workflow_dispatch）时 ref_name 是分支名，退回 v$VER
          if [[ "${RELEASE_TAG:-}" =~ ^v[0-9] ]]; then TAG="$RELEASE_TAG"; else TAG="v$VER"; fi

          TRIPLE="aarch64-apple-darwin"
          MACOS_DIR="src-tauri/target/$TRIPLE/release/bundle/macos"
          # tauri 已生成 app.tar.gz（自动更新目标）+ .sig
          mv "$MACOS_DIR/BoenMind.app.tar.gz" "../dist-mac/BoenMind_${VER}_aarch64.app.tar.gz"
          mv "$MACOS_DIR/BoenMind.app.tar.gz.sig" "../dist-mac/BoenMind_${VER}_aarch64.app.tar.gz.sig"
          cp src-tauri/target/$TRIPLE/release/bundle/dmg/*.dmg "../dist-mac/"
          # 热升级 runtime 资产：独立 bm-server 二进制（非 embed，桌面页面由壳提供）
          # gzip 压缩传输（升级下载量 80M → ~30M），验签后由后端解压落盘。
          # 归独立 tag（runtime-v$VER）发布，不进主发布页。
          mkdir -p ../dist-mac-runtime
          gzip -9 -c "../backend/target/$TRIPLE/release/bm-server" \
            > "../dist-mac-runtime/boenmind-runtime-${VER}-${TRIPLE}.gz"
          # 签名密钥兼容两种格式：先按 base64 解一层试签；失败则按原样文本重试
          if ! SIGN_KEY="$(echo "$TAURI_SIGNING_PRIVATE_KEY" | base64 -d 2>/dev/null || true)" || [ -z "$SIGN_KEY" ] \
            || ! pnpm exec tauri signer sign --private-key "$SIGN_KEY" \
                 --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
                 "../dist-mac-runtime/boenmind-runtime-${VER}-${TRIPLE}.gz" 2>/dev/null; then
            pnpm exec tauri signer sign \
              --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
              --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
              "../dist-mac-runtime/boenmind-runtime-${VER}-${TRIPLE}.gz"
          fi

          # latest.json：签名直接读已 mv 到 dist-mac 的 .sig 文件
          # （tauri 生成的 latest.json 位置随版本变动，而 .sig 路径稳定且内容即 signature 字段）
          python3 - "$VER" "$TAG" <<'PY'
          import datetime, json, sys
          ver, tag = sys.argv[1], sys.argv[2]
          base = f"https://github.com/SadBoen/BoenMind/releases/download/{tag}"
          merged = {
              "version": ver,
              "notes": f"BoenMind v{ver}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {},
          }
          for arch in ("aarch64",):
              sig_path = f"../dist-mac/BoenMind_{ver}_{arch}.app.tar.gz.sig"
              with open(sig_path) as f:
                  signature = f.read().strip()
              merged["platforms"][f"darwin-{arch}"] = {
                  "url": f"{base}/BoenMind_{ver}_{arch}.app.tar.gz",
                  "signature": signature,
              }
          with open("../dist-mac/latest.json", "w") as f:
              json.dump(merged, f, ensure_ascii=False)
          PY
          ls -la ../dist-mac/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist-mac/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: macos-runtime
          path: dist-mac-runtime/*
          if-no-files-found: error

  # ============================================================
  # Windows：便携版（免安装，zip 打包 exe）
  # 说明：应用内热升级（运行时 bm-server）可用；壳（Tauri 外框）更新
  # 需手动下载新版便携包替换。
  # ============================================================
  windows:
    name: Windows 便携版
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 构建（不打包安装器，仅产出 exe）
        working-directory: frontend
        run: pnpm tauri build --no-bundle

      # tauri build 只产 app 壳；bm-server 是独立 workspace crate，需显式构建
      # embed-plugins：内置插件内嵌进二进制（用户机器无仓库路径，普通构建预装失效）
      - name: 构建 bm-server runtime 二进制
        working-directory: backend
        run: cargo build --release -p bm-server --features embed-plugins

      - name: 打包便携版 zip
        shell: pwsh
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $VER = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path ..\dist-win | Out-Null
          # 二进制名来自 Cargo package name（app.exe），对外重命名为 BoenMind.exe
          Copy-Item src-tauri\target\release\app.exe ..\dist-win\BoenMind.exe
          Compress-Archive -Path ..\dist-win\BoenMind.exe -DestinationPath "..\dist-win\BoenMind_${VER}_x64_portable.zip" -CompressionLevel Optimal
          # 热升级 runtime 资产：独立 bm-server.exe gzip 压缩（Node zlib，runner 无 gzip 命令）
          # + 签名；归独立 tag（runtime-v$VER）发布
          New-Item -ItemType Directory -Force -Path ..\dist-win-runtime | Out-Null
          node -e "const z=require('zlib'),fs=require('fs');const i='..\\backend\\target\\release\\bm-server.exe',o='..\\dist-win-runtime\\boenmind-runtime-${VER}-x86_64-pc-windows-msvc.exe.gz';fs.writeFileSync(o,z.gzipSync(fs.readFileSync(i),{level:9}))"
          # 签名密钥：统一转成单行 base64 后经 --private-key 传入
          # （Windows 版 signer 的 --private-key-path 强制 base64 解码，对 minisign 文本必失败；
          #   --private-key 接受 base64 单行；PowerShell 不能传多行字符串参数，故必须单行）
          $secret = $env:TAURI_SIGNING_PRIVATE_KEY
          try {
            $null = [Convert]::FromBase64String($secret.Trim())
            $keyArg = $secret.Trim()   # 已是 base64：原样单行
          } catch {
            $keyArg = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($secret))  # 文本：编码成单行 base64
          }
          pnpm exec tauri signer sign --private-key $keyArg --password $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD "..\dist-win-runtime\boenmind-runtime-${VER}-x86_64-pc-windows-msvc.exe.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist-win/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: windows-runtime
          path: dist-win-runtime/*
          if-no-files-found: error

  # ============================================================
  # Linux 服务器版：bm-server（内嵌前端，--features embed）
  # ============================================================
  linux-server:
    name: Linux 服务器版
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: backend

      - name: 构建前端（内嵌进二进制的 dist）
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build

      - name: 构建 x86_64 服务器版
        working-directory: backend
        run: cargo build --release -p bm-server --features embed

      - name: 构建 aarch64 服务器版（cargo-zigbuild 交叉编译）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: goto-bus-stop/setup-zig@v2
      - name: 交叉编译 aarch64
        working-directory: backend
        run: cargo zigbuild --release -p bm-server --features embed --target aarch64-unknown-linux-gnu

      - name: 打包 tar.gz（二进制 + 安装脚本 + systemd unit + 说明）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euxo pipefail
          VER="$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")"
          mkdir -p dist-linux dist-linux-runtime
          # signer 经 pnpm --dir frontend 执行（cwd=frontend），文件路径用绝对路径
          DIST_DIR="$(pwd)/dist-linux"
          DIST_DIR_RUNTIME="$(pwd)/dist-linux-runtime"
          # x86_64 为原生构建（target/release），aarch64 为 zigbuild 交叉构建
          for ARCH in x86_64 aarch64; do
            BIN="backend/target/release/bm-server"
            [ "$ARCH" = aarch64 ] && BIN="backend/target/aarch64-unknown-linux-gnu/release/bm-server"
            STAGE="boenmind-server_${VER}_linux-${ARCH}"
            mkdir -p "$STAGE"
            cp "$BIN" "$STAGE/bm-server"
            cp packaging/linux/install.sh "$STAGE/install.sh"
            cp packaging/linux/boenmind.service "$STAGE/boenmind.service"
            cp packaging/linux/README.md "$STAGE/README.md"
            sed -i "s/__VERSION__/${VER}/" "$STAGE/install.sh"
            chmod +x "$STAGE/install.sh"
            tar czf "$DIST_DIR/$STAGE.tar.gz" "$STAGE"
            rm -rf "$STAGE"
            # 热升级 runtime 资产：gzip 压缩（embed，含前端）+ 签名，归独立 tag 发布
            gzip -9 -c "$BIN" > "$DIST_DIR_RUNTIME/boenmind-runtime-${VER}-linux-${ARCH}.gz"
            # 签名密钥兼容两种格式：先按 base64 解一层试签；失败则按原样文本重试
            if ! SIGN_KEY="$(echo "$TAURI_SIGNING_PRIVATE_KEY" | base64 -d 2>/dev/null || true)" || [ -z "$SIGN_KEY" ] \
              || ! pnpm --dir frontend exec tauri signer sign --private-key "$SIGN_KEY" \
                   --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
                   "$DIST_DIR_RUNTIME/boenmind-runtime-${VER}-linux-${ARCH}.gz" 2>/dev/null; then
              pnpm --dir frontend exec tauri signer sign \
                --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
                --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
                "$DIST_DIR_RUNTIME/boenmind-runtime-${VER}-linux-${ARCH}.gz"
            fi
          done
          ls -la dist-linux/ dist-linux-runtime/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist-linux/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: linux-runtime
          path: dist-linux-runtime/*
          if-no-files-found: error

      # Docker 多架构镜像（仅正式 tag 推送；试跑跳过）。
      # 注入 zigbuild 预构建二进制，避免 QEMU 模拟编译 pi_agent_rust。
      - name: 准备 Docker 构建上下文
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p .ci-bins
          cp backend/target/release/bm-server .ci-bins/bm-server-x86_64
          cp backend/target/aarch64-unknown-linux-gnu/release/bm-server .ci-bins/bm-server-aarch64

      - name: 登录 ghcr.io
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 推送多架构镜像
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euxo pipefail
          VER="$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")"
          IMG="ghcr.io/sadboen/boenmind:v${VER}"
          docker buildx create --use
          docker buildx build -f packaging/linux/Dockerfile.ci \
            --platform linux/amd64 --build-arg BM_BINARY=bm-server-x86_64 \
            -t "${IMG}-amd64" --push .
          docker buildx build -f packaging/linux/Dockerfile.ci \
            --platform linux/arm64 --build-arg BM_BINARY=bm-server-aarch64 \
            -t "${IMG}-arm64" --push .
          # buildx 推送的 tag 是 manifest list（含 provenance attestation），
          # docker manifest create 不接受，用 buildx imagetools 合并多架构索引
          docker buildx imagetools create -t "$IMG" "${IMG}-amd64" "${IMG}-arm64"

  # ============================================================
  # 聚合发布：创建 GitHub Release 并上传全部产物（仅正式 tag）
  # ============================================================
  release:
    name: 创建 GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows, linux-server]
    runs-on: ubuntu-latest
    steps:
      - name: 计算版本号（tag v0.1.3 → 0.1.3）
        run: echo "VER=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: "macos-artifacts|windows-artifacts|linux-artifacts"
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: runtime-assets
          pattern: "*-runtime"
          merge-multiple: true

      - name: 产物清单
        run: |
          echo "== 主发布（人用的安装包） =="
          ls -la release-assets/
          echo "== runtime（热升级内部资产，独立 tag） =="
          ls -la runtime-assets/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          fail_on_unmatched_files: true
          files: release-assets/*
          body: |
            ## BoenMind ${{ github.ref_name }}

            个人知识管理软件：LLM-WIKI 路线 + 个人 Agent。

            ### 热升级（不重装、不退出程序）

            桌面版与 Linux 服务器版均支持应用内热升级：「设置 → 关于 → 检查更新 → 立即升级」，
            下载验证后后端秒级自重启，窗口/浏览器不退出。仅当需要更新桌面壳（Tauri 外框）时才需重新下载安装包。

            > 运行时资产（`boenmind-runtime-*`）已移至独立 tag `runtime-${{ github.ref_name }}`，
            > 主发布页只放安装包。v0.1.2 及更早版本的用户请先更新桌面壳/安装包，再使用应用内热升级。

            ### 下载

            **macOS（Apple Silicon）**
            - `BoenMind_*.dmg` 安装镜像；或 `BoenMind_*.app.tar.gz` 解压即用
            - 未签名（无 Apple 开发者证书）：首次打开请在「系统设置 → 隐私与安全性」中允许，或对应用右键 → 打开
            - 说明：v0.1.2 起不再发布 Intel 版；Intel Mac 可继续使用 v0.1.1

            **Windows（便携版，免安装）**
            - `BoenMind_*_x64_portable.zip` 解压运行 `BoenMind.exe`
            - 依赖系统 WebView2（Win10/11 自带；老版本 Win10 需自行安装 WebView2 Runtime）
            - 壳（外框）更新需手动下载新版便携包
            - 内置插件（ctx-compactor 压缩 / web-search 搜索 / refine-suggest 改进建议）随程序预装，默认启用

            **Linux 服务器版（x86_64 / aarch64）**
            - `boenmind-server_*_linux-*.tar.gz`：单文件二进制（前端已内嵌）
            - 安装：`sudo bash install.sh`（自动创建 systemd 服务并启动）
            - 应用内热升级：升级时后端原子替换自身并 exec 重启（PID 不变，systemd 无感知）
            - Docker：`docker run -d -p 17321:17321 -v boenmind-data:/var/lib/boenmind ghcr.io/sadboen/boenmind:${{ github.ref_name }}`
            - Docker 部署不参与应用内热升级，请用 `docker pull` 更新镜像
            - 详细说明见包内 README.md；无登录认证，请仅在可信内网使用

            ### 安全提示
            服务器版为 HTTP 明文且无登录认证，配置中的 API 密钥对能访问该端口的任何人可见，
            请仅在可信内网使用，或通过反向代理加访问密码 / HTTPS 后对外。

      # 运行时（热升级）独立 Release：prerelease 不进 releases/latest，
      # 不影响主发布页与两个更新器的版本判断
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: runtime-v${{ env.VER }}
          prerelease: true
          fail_on_unmatched_files: true
          files: runtime-assets/*
          body: |
            ## BoenMind 运行时（应用内热升级内部资产）

            各平台的 `bm-server` 后端二进制（gzip 压缩传输，应用内升级时验签后解压落盘）。
            **请勿手动安装**——应用内「设置 → 关于 → 检查更新」会自动使用这些资产。

            - `boenmind-runtime-<版本>-<平台>.gz` + `.sig`：后端热升级产物
