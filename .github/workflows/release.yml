# BoenMind 发布流程：打 tag v* 自动构建四类产物并创建 GitHub Release
#   - macOS ARM / Intel（dmg + app.tar.gz + 自动更新签名）
#   - Windows 便携版（zip，免安装）
#   - Linux 服务器版（单文件二进制 tar.gz，x86_64 + aarch64）
#   - Docker 多架构镜像（ghcr.io/sadboen/boenmind）
# 也可 workflow_dispatch 手动触发试跑（不创建 Release、不推 Docker）。
#
# 前置条件（一次性）：仓库 Secrets 添加
#   TAURI_SIGNING_PRIVATE_KEY        = base64 ~/.boenmind/tauri-update.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# 没有这两个 Secret 时 macOS job 会失败（createUpdaterArtifacts 需要签名）。

name: Release

on:
  push:
    branches: ["main"] # 日常 push 只跑质量门（quality job）
    tags: ["v*"]       # 打 tag 全量构建发布
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11"

jobs:
  # ============================================================
  # 质量门：后端测试 + clippy（-D warnings）+ 前端 strict 类型检查 + lint。
  # 构建前拦截回归（曾出现 0 测试、CI 只验证"能编译"的问题）。
  # ============================================================
  quality:
    name: 质量门 (test + lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: 后端测试
        working-directory: backend
        run: cargo test -p bm-core -p bm-server

      - name: 后端 clippy（-D warnings）
        working-directory: backend
        run: cargo clippy -p bm-core -p bm-server --lib --no-deps -- -D warnings

      - name: 前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 前端类型检查（strict）
        working-directory: frontend
        run: pnpm exec tsc -b

      - name: 前端 lint
        working-directory: frontend
        run: pnpm lint

  # ============================================================
  # macOS：同一 runner 上交叉编译 ARM + Intel（Tauri 官方支持）
  # ============================================================
  macos:
    name: macOS (ARM + Intel)
    runs-on: macos-14
    # 日常 push main 只跑质量门；构建/发布仅在打 tag 或手动触发
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: 安装前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 构建 Apple Silicon 版 (aarch64)
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 无 Apple 开发者证书：ad-hoc 签名（未 notarize，首次打开需右键）
          TAURI_SIGNING_IDENTITY: "-"
        run: pnpm tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: 构建 Intel 版 (x86_64)
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_IDENTITY: "-"
        run: pnpm tauri build --target x86_64-apple-darwin --bundles app,dmg

      - name: 收集产物并合并自动更新清单 (latest.json)
        working-directory: frontend
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euxo pipefail
          mkdir -p ../dist-mac
          VER="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          # 试跑（workflow_dispatch）时 ref_name 是分支名，退回 v$VER
          if [[ "${RELEASE_TAG:-}" =~ ^v[0-9] ]]; then TAG="$RELEASE_TAG"; else TAG="v$VER"; fi
          # 签名密钥（secret 为双重 base64；signer CLI 需要单层 base64 = 密钥文件内容）
          SIGNING_KEY="$(echo "$TAURI_SIGNING_PRIVATE_KEY" | base64 -d)"

          for ARCH in aarch64 x86_64; do
            TRIPLE="$([ "$ARCH" = aarch64 ] && echo aarch64-apple-darwin || echo x86_64-apple-darwin)"
            MACOS_DIR="src-tauri/target/$TRIPLE/release/bundle/macos"
            # tauri 已生成 app.tar.gz（自动更新目标）+ .sig，重命名带架构避免冲突
            mv "$MACOS_DIR/BoenMind.app.tar.gz" "../dist-mac/BoenMind_${VER}_${ARCH}.app.tar.gz"
            mv "$MACOS_DIR/BoenMind.app.tar.gz.sig" "../dist-mac/BoenMind_${VER}_${ARCH}.app.tar.gz.sig"
            cp src-tauri/target/$TRIPLE/release/bundle/dmg/*.dmg "../dist-mac/"
            # 热升级 runtime 资产：独立 bm-server 二进制（非 embed，桌面页面由壳提供）+ 签名
            RUNTIME_BIN="src-tauri/target/$TRIPLE/release/bm-server"
            cp "$RUNTIME_BIN" "../dist-mac/boenmind-runtime-${VER}-${TRIPLE}"
            pnpm exec tauri signer sign \
              --private-key "$SIGNING_KEY" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
              "../dist-mac/boenmind-runtime-${VER}-${TRIPLE}"
          done

          # 合并两个架构的 latest.json：签名直接读已 mv 到 dist-mac 的 .sig 文件
          # （tauri 生成的 latest.json 位置随版本变动，而 .sig 路径稳定且内容即 signature 字段）
          python3 - "$VER" "$TAG" <<'PY'
          import datetime, json, sys
          ver, tag = sys.argv[1], sys.argv[2]
          base = f"https://github.com/SadBoen/BoenMind/releases/download/{tag}"
          merged = {
              "version": ver,
              "notes": f"BoenMind v{ver}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {},
          }
          for arch in ("aarch64", "x86_64"):
              sig_path = f"../dist-mac/BoenMind_{ver}_{arch}.app.tar.gz.sig"
              with open(sig_path) as f:
                  signature = f.read().strip()
              merged["platforms"][f"darwin-{arch}"] = {
                  "url": f"{base}/BoenMind_{ver}_{arch}.app.tar.gz",
                  "signature": signature,
              }
          with open("../dist-mac/latest.json", "w") as f:
              json.dump(merged, f, ensure_ascii=False)
          PY
          ls -la ../dist-mac/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist-mac/*
          if-no-files-found: error

  # ============================================================
  # Windows：便携版（免安装，zip 打包 exe）
  # 说明：应用内热升级（运行时 bm-server）可用；壳（Tauri 外框）更新
  # 需手动下载新版便携包替换。
  # ============================================================
  windows:
    name: Windows 便携版
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 构建（不打包安装器，仅产出 exe）
        working-directory: frontend
        run: pnpm tauri build --no-bundle

      - name: 打包便携版 zip
        shell: pwsh
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $VER = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path ..\dist-win | Out-Null
          # 二进制名来自 Cargo package name（app.exe），对外重命名为 BoenMind.exe
          Copy-Item src-tauri\target\release\app.exe ..\dist-win\BoenMind.exe
          Compress-Archive -Path ..\dist-win\BoenMind.exe -DestinationPath "..\dist-win\BoenMind_${VER}_x64_portable.zip" -CompressionLevel Optimal
          # 热升级 runtime 资产：独立 bm-server.exe（非 embed）+ 签名
          Copy-Item src-tauri\target\release\bm-server.exe "..\dist-win\boenmind-runtime-${VER}-x86_64-pc-windows-msvc.exe"
          # secret 为双重 base64，signer CLI 需要单层 base64（= 密钥文件内容）
          $signingKey = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:TAURI_SIGNING_PRIVATE_KEY))
          pnpm exec tauri signer sign --private-key $signingKey --password $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD "..\dist-win\boenmind-runtime-${VER}-x86_64-pc-windows-msvc.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist-win/*
          if-no-files-found: error

  # ============================================================
  # Linux 服务器版：bm-server（内嵌前端，--features embed）
  # ============================================================
  linux-server:
    name: Linux 服务器版
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: 构建前端（内嵌进二进制的 dist）
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build

      - name: 构建 x86_64 服务器版
        working-directory: backend
        run: cargo build --release -p bm-server --features embed

      - name: 构建 aarch64 服务器版（cargo-zigbuild 交叉编译）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: goto-bus-stop/setup-zig@v2
      - name: 交叉编译 aarch64
        working-directory: backend
        run: cargo zigbuild --release -p bm-server --features embed --target aarch64-unknown-linux-gnu

      - name: 打包 tar.gz（二进制 + 安装脚本 + systemd unit + 说明）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euxo pipefail
          VER="$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")"
          mkdir -p dist-linux
          # 签名密钥（secret 为双重 base64；signer CLI 需要单层 base64 = 密钥文件内容）
          SIGNING_KEY="$(echo "$TAURI_SIGNING_PRIVATE_KEY" | base64 -d)"
          # x86_64 为原生构建（target/release），aarch64 为 zigbuild 交叉构建
          for ARCH in x86_64 aarch64; do
            BIN="backend/target/release/bm-server"
            [ "$ARCH" = aarch64 ] && BIN="backend/target/aarch64-unknown-linux-gnu/release/bm-server"
            STAGE="boenmind-server_${VER}_linux-${ARCH}"
            mkdir -p "$STAGE"
            cp "$BIN" "$STAGE/bm-server"
            cp packaging/linux/install.sh "$STAGE/install.sh"
            cp packaging/linux/boenmind.service "$STAGE/boenmind.service"
            cp packaging/linux/README.md "$STAGE/README.md"
            sed -i "s/__VERSION__/${VER}/" "$STAGE/install.sh"
            chmod +x "$STAGE/install.sh"
            tar czf "dist-linux/$STAGE.tar.gz" "$STAGE"
            rm -rf "$STAGE"
            # 热升级 runtime 资产：独立 bm-server 二进制（embed，含前端）+ 签名
            cp "$BIN" "dist-linux/boenmind-runtime-${VER}-linux-${ARCH}"
            pnpm --dir frontend exec tauri signer sign \
              --private-key "$SIGNING_KEY" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
              "dist-linux/boenmind-runtime-${VER}-linux-${ARCH}"
          done
          ls -la dist-linux/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist-linux/*
          if-no-files-found: error

      # Docker 多架构镜像（仅正式 tag 推送；试跑跳过）。
      # 注入 zigbuild 预构建二进制，避免 QEMU 模拟编译 pi_agent_rust。
      - name: 准备 Docker 构建上下文
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p .ci-bins
          cp backend/target/release/bm-server .ci-bins/bm-server-x86_64
          cp backend/target/aarch64-unknown-linux-gnu/release/bm-server .ci-bins/bm-server-aarch64

      - name: 登录 ghcr.io
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 推送多架构镜像
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euxo pipefail
          VER="$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")"
          IMG="ghcr.io/sadboen/boenmind:v${VER}"
          docker buildx create --use
          docker buildx build -f packaging/linux/Dockerfile.ci \
            --platform linux/amd64 --build-arg BM_BINARY=bm-server-x86_64 \
            -t "${IMG}-amd64" --push .
          docker buildx build -f packaging/linux/Dockerfile.ci \
            --platform linux/arm64 --build-arg BM_BINARY=bm-server-aarch64 \
            -t "${IMG}-arm64" --push .
          # buildx 推送的 tag 是 manifest list（含 provenance attestation），
          # docker manifest create 不接受，用 buildx imagetools 合并多架构索引
          docker buildx imagetools create -t "$IMG" "${IMG}-amd64" "${IMG}-arm64"

  # ============================================================
  # 聚合发布：创建 GitHub Release 并上传全部产物（仅正式 tag）
  # ============================================================
  release:
    name: 创建 GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows, linux-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 产物清单
        run: ls -la release-assets/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          fail_on_unmatched_files: true
          files: release-assets/*
          body: |
            ## BoenMind ${{ github.ref_name }}

            个人知识管理软件：LLM-WIKI 路线 + 个人 Agent。

            ### 热升级（不重装、不退出程序）

            桌面版与 Linux 服务器版均支持应用内热升级：「设置 → 关于 → 检查更新 → 立即升级」，
            下载验证后后端秒级自重启，窗口/浏览器不退出。仅当需要更新桌面壳（Tauri 外框）时才需重新下载安装包。

            ### 下载

            **macOS（Apple Silicon / Intel）**
            - `BoenMind_*.dmg` 安装镜像；或 `BoenMind_*.app.tar.gz` 解压即用
            - 未签名（无 Apple 开发者证书）：首次打开请在「系统设置 → 隐私与安全性」中允许，或对应用右键 → 打开
            - 应用内可热升级运行时（`boenmind-runtime-*` 资产由后端验签后落盘）

            **Windows（便携版，免安装）**
            - `BoenMind_*_x64_portable.zip` 解压运行 `BoenMind.exe`
            - 依赖系统 WebView2（Win10/11 自带；老版本 Win10 需自行安装 WebView2 Runtime）
            - 应用内可热升级运行时；壳（外框）更新需手动下载新版便携包

            **Linux 服务器版（x86_64 / aarch64）**
            - `boenmind-server_*_linux-*.tar.gz`：单文件二进制（前端已内嵌）
            - 安装：`sudo bash install.sh`（自动创建 systemd 服务并启动）
            - 应用内热升级：升级时后端原子替换自身并 exec 重启（PID 不变，systemd 无感知）
            - Docker：`docker run -d -p 17321:17321 -v boenmind-data:/var/lib/boenmind ghcr.io/sadboen/boenmind:${{ github.ref_name }}`
            - Docker 部署不参与应用内热升级，请用 `docker pull` 更新镜像
            - 详细说明见包内 README.md；无登录认证，请仅在可信内网使用

            ### 安全提示
            服务器版为 HTTP 明文且无登录认证，配置中的 API 密钥对能访问该端口的任何人可见，
            请仅在可信内网使用，或通过反向代理加访问密码 / HTTPS 后对外。
