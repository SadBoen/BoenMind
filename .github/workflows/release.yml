name: release

# W7 起(2026-09-02):linux + windows 双平台 .tar.gz(在线升级按平台选资产);
# 统一由 release 作业收集建 Release。⚠ 铁规矩(用户 2026-09-02 明示):打 tag
# 发布必须用户明确说,任何自动化/代理不得自行发版。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            runtime
            plugins/mcp/web-multisearch
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runtime/webapp/package-lock.json

      - name: 前端构建(dist 入包)
        working-directory: runtime/webapp
        run: |
          npm ci
          npm run build

      # 插件进发布包前先过全量测试(测试挂了不发版)
      - name: 插件测试门禁
        working-directory: plugins/mcp/web-multisearch
        run: cargo test

      - name: 服务器构建
        working-directory: runtime
        run: cargo build --release --bin boenmind-server

      - name: 插件构建
        working-directory: plugins/mcp/web-multisearch
        run: cargo build --release

      - name: 打包(Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          PKG="boenmind-${VER}-windows-x86_64"
          mkdir -p "${PKG}/webapp" "${PKG}/plugins"
          cp runtime/target/release/boenmind-server.exe "${PKG}/"
          cp -r runtime/webapp/dist "${PKG}/webapp/dist"
          cp plugins/mcp/web-multisearch/target/release/web-multisearch.exe "${PKG}/plugins/"
          cp plugins/mcp/web-multisearch/README.md "${PKG}/plugins/web-multisearch-README.md"
          cp packaging/INSTALL.md "${PKG}/INSTALL.md"
          tar czf "${PKG}.tar.gz" "${PKG}"
          ls -la "${PKG}.tar.gz"

      - name: 打包(Linux)
        if: runner.os == 'Linux'
        run: |
          VER="${GITHUB_REF_NAME#v}"
          PKG="boenmind-${VER}-linux-x86_64"
          mkdir -p "${PKG}/webapp" "${PKG}/plugins"
          cp runtime/target/release/boenmind-server "${PKG}/"
          cp -r runtime/webapp/dist "${PKG}/webapp/dist"
          cp plugins/mcp/web-multisearch/target/release/web-multisearch "${PKG}/plugins/"
          cp plugins/mcp/web-multisearch/README.md "${PKG}/plugins/web-multisearch-README.md"
          cp packaging/INSTALL.md "${PKG}/INSTALL.md"
          tar czf "${PKG}.tar.gz" "${PKG}"
          ls -la "${PKG}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          path: boenmind-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: 校验和 + 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum boenmind-*.tar.gz > SHA256SUMS.txt
          VER="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            boenmind-*.tar.gz SHA256SUMS.txt \
            --title "BoenMind ${GITHUB_REF_NAME}" \
            --notes "BoenMind ${GITHUB_REF_NAME}(Linux x86_64 + Windows x86_64)。

          包内:boenmind-server(AI Runtime 服务器+网页界面)、plugins/web-multisearch(官方自带聚合搜索 MCP 插件)、webapp/dist(预构建前端)、安装说明。

          安装:解压后执行 boenmind-server,详见仓库 README「安装」一节;
          已装用户可在 网页 → 设置 → 关于 一键在线升级到本版本。
          需要 OpenSSL 3(Linux;Ubuntu 22.04+/Debian 12+ 默认自带),无需 Node/Python。"
