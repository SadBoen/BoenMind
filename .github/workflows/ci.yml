name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # S2: 合同库自身校验(R1-R4 全绿门)
  contracts-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python boenmind-contracts/scripts/validate.py
      # issue #23:版本号三处同步(Cargo.toml/package.json/AGENTS.md/Cargo.lock)CI 门
      - run: python scripts/check_version_sync.py

  # P1-38(2026-09-07 架构评审):apps 三个 Python MCP server 是发布面交付物
  # (release 随包),此前零测试零门禁——冒烟=真实 stdio 管道全协议往返
  apps-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m py_compile apps/wiki_server.py apps/market_server.py apps/music_server.py
      - run: python apps/smoke_test.py

  # BACKLOG 行16 收尾(2026-09-07):ESLint 前端体检接入 CI——本地每批必跑
  # (react-hooks rules-of-hooks/exhaustive-deps=error 级)此前 CI 不拦不合格前端代码
  webapp-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime/webapp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runtime/webapp/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build


  # S1 unit + S3 golden-trace + S5 log-redaction 随测试套件执行;三平台矩阵 = M0.3
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: "rustfmt, clippy"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace

  # 独立官方 MCP 插件：不进入 runtime workspace，但必须有自己的门禁
  # P1-40(2026-09-07 架构评审):插件有 native-tls / cfg(target_os="windows")
  # 分支,单 ubuntu 从未验证——矩阵对齐主 rust 三平台
  web-multisearch-plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/mcp/web-multisearch
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: "rustfmt, clippy"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/mcp/web-multisearch
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release

  context-inspector-plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/mcp/context-inspector
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: "rustfmt, clippy"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/mcp/context-inspector
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
