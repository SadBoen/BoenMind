name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ADR-0040:文档治理门——ADR 状态机 + 取代双向一致 + 归档一致 + 追踪白名单 + 治理自检。
  # 此前四套文档治理全是纸面规则、零机器门,故必然被下一套推翻;本 job 把可机器
  # 验证的部分固化为硬门(规则不再依赖自觉),并阻止治理门本身被静默摘除。
  doc-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/doc_gate.py

  # S2: 合同库自身校验(R1-R4 全绿门)
  contracts-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python boenmind-contracts/scripts/validate.py
      # issue #23:版本号三处同步(Cargo.toml/package.json/AGENTS.md/Cargo.lock)CI 门
      - run: python scripts/check_version_sync.py

  # P1-38(2026-09-07 架构评审):apps 三个 Python MCP server 是发布面交付物
  # (release 随包),此前零测试零门禁——冒烟=真实 stdio 管道全协议往返
  apps-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m py_compile apps/wiki_server.py apps/market_server.py apps/music_server.py apps/mcp_sdk.py scripts/mcp_smoke.py
      # ADR-0034(issue #56):Python 插件协议 SDK 单测(进程内驱动 run_stdio)
      - run: python apps/mcp_sdk_test.py
      - run: python scripts/mcp_smoke.py

  # BACKLOG 行16 收尾(2026-09-07):ESLint 前端体检接入 CI——本地每批必跑
  # (react-hooks rules-of-hooks/exhaustive-deps=error 级)此前 CI 不拦不合格前端代码
  webapp-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime/webapp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runtime/webapp/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build


  # S1 unit + S3 golden-trace + S5 log-redaction 随测试套件执行;三平台矩阵 = M0.3
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: "rustfmt, clippy"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace

  # ADR-0034(issue #56):插件协议最小 SDK。两插件以 path 依赖引入,
  # 本 job 单独门禁 SDK 自身的 fmt/clippy/test(插件 job 经 path dep 覆盖集成)。
  plugin-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/mcp/sdk
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: "rustfmt, clippy"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/mcp/sdk
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # 独立官方 MCP 插件：不进入 runtime workspace，但必须有自己的门禁
  # P1-40(2026-09-07 架构评审):插件有 native-tls / cfg(target_os="windows")
  # 分支,单 ubuntu 从未验证——矩阵对齐主 rust 三平台。
  # 2026-09-12:两插件 job 原逐字重复,合并为 {plugin × os} 矩阵(腿数不变)。
  official-plugin:
    strategy:
      fail-fast: false
      matrix:
        plugin: [web-multisearch, context-inspector]
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/mcp/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: "rustfmt, clippy"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/mcp/${{ matrix.plugin }}
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      # issue #56:插件协议一致性冒烟(initialize/tools.list/未知工具/未知方法/坏JSON)
      - run: python ../../../scripts/mcp_smoke.py --plugin ${{ matrix.plugin }}
