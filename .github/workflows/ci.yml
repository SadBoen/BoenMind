name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # S2: 合同库自身校验(R1-R4 全绿门)
  contracts-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python boenmind-contracts/scripts/validate.py

  # S1 unit + S3 golden-trace + S5 log-redaction 随测试套件执行;三平台矩阵 = M0.3
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: "rustfmt, clippy"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace

  # 独立官方 MCP 插件：不进入 runtime workspace，但必须有自己的门禁
  web-multisearch-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/mcp/web-multisearch
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: "rustfmt, clippy"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/mcp/web-multisearch
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release

  context-inspector-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/mcp/context-inspector
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: "rustfmt, clippy"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/mcp/context-inspector
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
