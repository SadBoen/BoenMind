[package]
name = "bm-surface-http"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
bm-contract = { workspace = true }
async-trait = { workspace = true }
bm-core = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
async-stream = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# W2 管理面连通探针(对 provider baseUrl 发 GET /models;UA 自报防 CF 拒收)
reqwest = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
pbkdf2 = { workspace = true }
tar = "0.4"
flate2 = "1"
# W7 目录树右键菜单:文件夹打包下载
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = { workspace = true }
# ADR-0046:surface 源码已完全经 core 端口解耦(ADR-0042 ModelRouter、
# ADR-0046 SkillHost/JobBoard/McpAdmin)——bm-providers 降为 dev-dependency,
# 仅在测试装配组合根/测试替身时使用。主依赖面不再需要它(编译期证明)。
bm-providers = { workspace = true }
bm-persist = { workspace = true }
bm-testkit = { workspace = true }

[lints]
workspace = true
