[workspace]
resolver = "2"
members = [
    "crates/bm-contract",
    "crates/bm-persist",
    "crates/bm-surface-http",
    "crates/bm-cli",
    "crates/bm-core",
    "crates/bm-providers",
    "crates/bm-testkit",
    "crates/bm-runtime",
    "crates/bm-judge",
]

[workspace.package]
version = "0.0.4"
edition = "2024"
repository = "https://github.com/SadBoen/BoenMind"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process", "io-util"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
ulid = { version = "1", features = ["serde"] }
# 合同 schema 全部内嵌、无远程 $ref:关闭默认特性以甩掉 reqwest/rustls/aws-lc 重链
jsonschema = { version = "0", default-features = false, features = ["resolve-file"] }
async-trait = "0.1"
proptest = "1"
tempfile = "3"
tracing = "0.1"
keyring = "3"
rusqlite = { version = "0", features = ["bundled", "backup"] }
sha2 = "0.10"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
async-stream = "0.3"
getrandom = "0.4"
dirs = "6"
clap = { version = "4", features = ["derive"] }
bm-surface-http = { path = "crates/bm-surface-http" }
bm-cli = { path = "crates/bm-cli" }
bm-persist = { path = "crates/bm-persist" }
bm-contract = { path = "crates/bm-contract" }
bm-core = { path = "crates/bm-core" }
bm-providers = { path = "crates/bm-providers" }
bm-testkit = { path = "crates/bm-testkit" }
bm-judge = { path = "crates/bm-judge" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
