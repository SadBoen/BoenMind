<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BoenMind 控制台</title>
<link rel="stylesheet" href="tokens.css">
<script>
// 主题尽早应用,防首帧闪色;三态记 localStorage(bm.theme)
(function () {
  var t = localStorage.getItem("bm.theme") || "auto";
  var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
})();
</script>
<style>
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; display:grid; grid-template-columns:264px 1fr auto;
    background:var(--bm-alias-bg-base); color:var(--bm-alias-label-primary);
    font:14px/1.6 var(--bm-font-family);
    transition:background var(--bm-transition-duration) var(--bm-ease-in-out);
  }
  button, input, select, textarea {
    font:inherit; color:inherit; background:transparent; border:0; outline:0;
  }
  button { cursor:pointer; }

  /* ===== 左侧栏 ===== */
  #side {
    background:var(--bm-specific-sidebar-fill); border-right:1px solid var(--bm-alias-border-l1);
    display:flex; flex-direction:column; padding:14px 12px; gap:10px; min-height:0;
  }
  #side .logo { display:flex; align-items:baseline; gap:8px; padding:2px 6px 8px; }
  #side .logo b { font-size:16px; letter-spacing:.02em; }
  #side .logo .ver {
    font-size:10px; color:var(--bm-alias-label-tertiary);
    border:1px solid var(--bm-alias-border-l2); border-radius:6px; padding:0 5px;
  }
  #newBtn {
    background:var(--bm-alias-button-primary-fill); color:var(--bm-alias-label-primary-foreground);
    border-radius:10px; padding:9px 12px; font-weight:500; text-align:center;
    transition:background var(--bm-transition-duration-fast) var(--bm-ease-in-out);
  }
  #newBtn:hover { background:var(--bm-alias-button-primary-hover); }
  #side h3 {
    margin:8px 6px 2px; font-size:11px; font-weight:500; letter-spacing:.06em;
    text-transform:uppercase; color:var(--bm-alias-label-caption);
  }
  .navitem {
    display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px;
    color:var(--bm-alias-label-secondary); width:100%; text-align:left;
    transition:background var(--bm-transition-duration-fast) var(--bm-ease-in-out);
  }
  .navitem:hover { background:var(--bm-specific-sidebar-nav-item-hover); color:var(--bm-alias-label-primary); }
  #side .spacer { flex:1; }
  #sessCard {
    border:1px solid var(--bm-alias-border-l1); border-radius:10px; padding:8px 10px;
    font-size:12px; color:var(--bm-alias-label-tertiary); margin:0 2px;
  }
  #sessCard b { display:block; color:var(--bm-alias-label-secondary); font-weight:500;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #connBox { border-top:1px solid var(--bm-alias-border-l1); padding-top:10px; display:grid; gap:6px; }
  #connBox input {
    background:var(--bm-specific-login-input); border:1px solid var(--bm-alias-border-l1);
    border-radius:8px; padding:6px 9px; font-size:12px; width:100%;
  }
  #connBox input:focus { border-color:var(--bm-alias-button-info-fill); }
  #connBtn {
    border:1px solid var(--bm-alias-border-l2); border-radius:8px; padding:6px;
    color:var(--bm-alias-label-secondary); text-align:center; font-size:12px;
  }
  #connBtn:hover { border-color:var(--bm-alias-button-info-fill); color:var(--bm-alias-label-primary); }
  #conn { font-size:11px; padding:1px 8px; border-radius:10px; justify-self:start;
    background:var(--bm-specific-tip); color:var(--bm-alias-label-tertiary); }
  #conn.ok { color:var(--bm-alias-state-success-primary); }
  .themeRow { display:flex; gap:4px; }
  .themeRow button {
    flex:1; font-size:11px; padding:5px 0; border-radius:7px; color:var(--bm-alias-label-tertiary);
    border:1px solid transparent;
  }
  .themeRow button:hover { background:var(--bm-alias-interactive-bg-hover); color:var(--bm-alias-label-primary); }
  .themeRow button[aria-pressed="true"] {
    background:var(--bm-specific-tip); color:var(--bm-alias-label-primary);
    border-color:var(--bm-alias-border-l1);
  }
  .slot { display:contents; }
  #slot-sidebar-extra { display:grid; gap:6px; }

  /* ===== 主区:对话 ===== */
  #main { display:flex; flex-direction:column; min-width:0; min-height:0; }
  #welcome {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; color:var(--bm-alias-label-secondary); pointer-events:none; padding-bottom:110px;
  }
  #welcome b { font-size:26px; font-weight:500; color:var(--bm-alias-label-primary); display:flex; align-items:center; gap:10px; }
  #welcome .pre {
    font-size:10px; color:var(--bm-alias-label-tertiary); border:1px solid var(--bm-alias-border-l2);
    border-radius:6px; padding:1px 6px; margin-left:4px;
  }
  body:has(#log > .msg) #welcome { display:none; }
  #log {
    flex:1; overflow-y:auto; padding:26px 8px 12px; display:flex; flex-direction:column; gap:10px;
    scrollbar-width:thin; scrollbar-color:var(--bm-alias-scrollbar-bg-l1) transparent;
  }
  .msg { max-width:min(72%, 760px); padding:9px 14px; border-radius:14px;
    white-space:pre-wrap; word-break:break-word; font-size:14px; }
  .msg.user { align-self:flex-end; background:var(--bm-specific-bubble); color:var(--bm-alias-label-primary); }
  .msg.assistant { align-self:flex-start; background:var(--bm-alias-bg-layer-2);
    border:1px solid var(--bm-alias-border-l1); color:var(--bm-alias-label-primary); }
  .msg.runtime { align-self:center; background:transparent; color:var(--bm-alias-label-tertiary);
    font-size:12px; padding:2px 8px; }
  .msg.error { align-self:center; background:var(--bm-alias-state-error-secondary);
    color:var(--bm-alias-label-primary); font-size:12px; border-radius:9px; }
  .msg .who { color:var(--bm-alias-label-tertiary); font-size:12px; margin-right:6px; }
  .msg.user .who, .msg.assistant .who { display:none; }

  /* ===== 输入卡 ===== */
  #composer { padding:10px 22px 20px; }
  #composerCard {
    background:var(--bm-specific-input-major); border:1px solid var(--bm-alias-border-l2);
    border-radius:16px; padding:12px 12px 8px; display:grid; gap:8px;
    transition:border-color var(--bm-transition-duration-fast) var(--bm-ease-in-out);
  }
  #composerCard:focus-within { border-color:var(--bm-alias-button-info-fill); }
  #input { width:100%; resize:none; padding:2px 4px; min-height:24px; max-height:160px; }
  #input::placeholder { color:var(--bm-alias-label-dimmed); }
  #composerTools { display:flex; align-items:center; gap:6px; }
  #composerTools .tool {
    width:30px; height:30px; border-radius:8px; display:grid; place-items:center;
    color:var(--bm-alias-label-tertiary); font-size:16px;
  }
  #composerTools .tool:hover { background:var(--bm-alias-interactive-bg-hover); color:var(--bm-alias-label-primary); }
  #sendBtn {
    margin-left:auto; width:32px; height:32px; border-radius:50%;
    background:var(--bm-alias-button-info-fill); color:var(--bm-alias-label-primary-foreground);
    display:grid; place-items:center; font-size:15px;
    transition:background var(--bm-transition-duration-fast) var(--bm-ease-in-out);
  }
  #sendBtn:hover { background:var(--bm-alias-button-info-hover); }
  #composerTools .slot { display:contents; }
  #slot-composer-tools { display:flex; gap:6px; align-items:center; }

  /* ===== 右侧监护栏 ===== */
  #guard {
    width:308px; border-left:1px solid var(--bm-alias-border-l1); padding:14px 12px;
    display:flex; flex-direction:column; gap:12px; min-height:0; overflow-y:auto;
    background:var(--bm-specific-sidebar-fill);
  }
  body.guard-off #guard { display:none; }
  body.guard-off { grid-template-columns:264px 1fr; }
  #guard h2 {
    margin:0 2px 8px; font-size:11px; font-weight:500; letter-spacing:.06em;
    text-transform:uppercase; color:var(--bm-alias-label-caption);
    display:flex; align-items:center; justify-content:space-between;
  }
  #guard h2 button { color:var(--bm-alias-label-tertiary); font-size:12px; }
  #guard h2 button:hover { color:var(--bm-alias-label-primary); }
  .panel { background:var(--bm-alias-bg-layer-2); border:1px solid var(--bm-alias-border-l1);
    border-radius:12px; padding:10px; }
  #guard ul { list-style:none; margin:0; padding:0; display:grid; gap:6px; }
  #guard li {
    border:1px solid var(--bm-alias-border-l1); border-radius:9px; padding:7px 9px;
    display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:13px;
  }
  .tag { font-size:11px; padding:1px 8px; border-radius:10px;
    background:var(--bm-specific-tip); color:var(--bm-alias-label-tertiary); }
  #guard .ok { color:var(--bm-alias-state-success-primary); }
  #guard .err { color:var(--bm-alias-state-error-primary); }
  #guard button.p, #guard button:not(.tag) {
    border:1px solid var(--bm-alias-border-l2); border-radius:8px; padding:4px 10px;
    font-size:12px; color:var(--bm-alias-label-secondary);
  }
  #guard button.p { background:var(--bm-alias-button-info-fill); border-color:transparent;
    color:var(--bm-alias-label-primary-foreground); }
  #guard button:hover { border-color:var(--bm-alias-button-info-fill); color:var(--bm-alias-label-primary); }
  #guard button.p:hover { background:var(--bm-alias-button-info-hover); color:var(--bm-alias-label-primary-foreground); }
  #slot-guard-extra { display:grid; gap:12px; }
  @media (max-width: 980px) { body, body.guard-off { grid-template-columns:64px 1fr; }
    #side .logo b, #side h3, #newBtn, #connBox, #sessCard, .navitem span { display:none; } }
</style>
</head>
<body>
<nav id="side">
  <div class="logo"><b>BoenMind</b><span class="ver">控制台</span></div>
  <button id="newBtn" onclick="createSession()">＋ 新会话</button>
  <div id="sessCard">当前会话<b id="sessId">未创建</b><span id="agentTag">agent: assistant</span></div>
  <h3>监护</h3>
  <button class="navitem" onclick="document.body.classList.toggle('guard-off')">◈ 审批与任务</button>
  <div class="slot" data-slot="sidebar-extra" id="slot-sidebar-extra"></div>
  <div class="spacer"></div>
  <div id="connBox">
    <input id="base" placeholder="server 地址(缺省同源)">
    <input id="token" placeholder="访问令牌(auth.v0_1)" type="password">
    <button id="connBtn" onclick="saveCfg()">连接</button>
    <span id="conn" class="tag">未连接</span>
    <input id="agentName" placeholder="agent 名称(高级)" value="assistant">
  </div>
  <div class="themeRow" id="themeRow">
    <button data-t="light">浅色</button>
    <button data-t="dark">深色</button>
    <button data-t="auto">跟随系统</button>
  </div>
  <a class="navitem" href="/cli.html" style="text-decoration:none">⌨ CLI 终端</a>
</nav>

<main id="main">
  <div id="welcome"><b>BoenMind<span class="pre">预览版</span></b><span>个人生态的 AI Runtime · 新会话即可开始</span></div>
  <div id="log"></div>
  <div id="composer">
    <div id="composerCard">
      <input id="input" placeholder="输入内容(trusted)…">
      <div id="composerTools">
        <button class="tool" title="健康检查" onclick="health()">+</button>
        <div class="slot" data-slot="composer-tools" id="slot-composer-tools"></div>
        <button id="sendBtn" title="发送回合" onclick="sendInput()">↑</button>
      </div>
    </div>
  </div>
</main>

<aside id="guard">
  <section class="panel">
    <h2>审批队列 <button onclick="document.body.classList.add('guard-off')">收起 ›</button></h2>
    <ul id="approvals"></ul>
    <div style="margin-top:6px"><button onclick="loadApprovals()">刷新</button></div>
  </section>
  <section class="panel">
    <h2>任务看板</h2>
    <ul id="tasks"></ul>
    <div style="margin-top:6px"><button onclick="loadTasks()">刷新</button></div>
  </section>
  <div class="slot" data-slot="guard-extra" id="slot-guard-extra"></div>
</aside>

<script>
const $ = (id) => document.getElementById(id);
let sessionId = "", agentId = "", lastSeq = 0, pollTimer = null;

function saveCfg() {
  localStorage.setItem("bm.base", $("base").value.trim());
  localStorage.setItem("bm.token", $("token").value.trim());
  conn();
}
function cfg() {
  return {
    base: localStorage.getItem("bm.base") || "",
    token: localStorage.getItem("bm.token") || ""
  };
}
function conn() {
  const c = cfg();
  $("base").value = c.base; $("token").value = c.token;
  // 连通性探测用必然成功的调用(此前错用不存在的 operation → 永远显示未连接)
  api("task.list", {})
    .then(() => { $("conn").textContent = "已连接"; $("conn").classList.add("ok"); })
    .catch(() => { $("conn").textContent = "未连接(检查地址/令牌)"; $("conn").classList.remove("ok"); });
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(loadApprovals, 3000);
  loadApprovals(); loadTasks();
}
async function api(method, params) {
  const c = cfg();
  const base = c.base || location.origin;
  const r = await fetch(`${base}/rpc/${method}`, {
    method: "POST",
    headers: Object.assign({ "Content-Type": "application/json" },
      c.token ? { Authorization: `Bearer ${c.token}` } : {}),
    body: JSON.stringify({ v: "0.1", method, request_id: rid(), params })
  });
  const body = await r.json();
  if (!body.ok) throw new Error(body.error ? `${body.error.code}: ${body.error.message}` : "HTTP " + r.status);
  return body.result;
}
function rid() {
  let s = "req_";
  for (let i = 0; i < 26; i++) s += "0123456789ABCDEFGHJKMNPQRSTVWXYZ"[Math.floor(Math.random() * 32)];
  return s;
}
function log(who, text) {
  // 安全审计修复:消息一律 textContent,杜绝 LLM/App 输出注入 HTML
  const d = document.createElement("div");
  d.className = "msg " + who; // 改版:附类型类供对话式样式(逻辑不变)
  const w = document.createElement("span");
  w.className = "who" + (who === "runtime" ? " sys" : "");
  w.textContent = who;
  d.appendChild(w);
  d.appendChild(document.createTextNode(" " + text));
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
}
// M9-S2 真流式:在途回答的增量缓冲(回执 ID → DOM 节点)
const streamBuf = new Map();
function streamDelta(opId, delta) {
  if (!streamBuf.has(opId)) {
    const d = document.createElement("div");
    d.className = "msg assistant";
    const w = document.createElement("span");
    w.className = "who";
    w.textContent = "assistant·流式";
    d.appendChild(w);
    const t = document.createTextNode("");
    d.appendChild(t);
    $("log").appendChild(d);
    $("log").scrollTop = $("log").scrollHeight;
    streamBuf.set(opId, { node: t, text: "" });
  }
  const b = streamBuf.get(opId);
  b.text += delta;
  b.node.textContent = " " + b.text + " ▌";
}
function finishStream(opId) {
  const b = streamBuf.get(opId);
  if (b) b.node.textContent = " " + b.text;
  streamBuf.delete(opId);
}
async function createSession() {
  try {
    const res = await api("session.create", {
      agent: { name: $("agentName").value || "assistant",
               model_chain: ["gpt-5.6-luna"],
               budget: { max_tokens: 200000, max_turns: 20 } }
    });
    sessionId = res.session_id; agentId = res.agent_id;
    log("runtime", `会话已创建 ${sessionId}(agent ${agentId})`);
    $("sessId").textContent = sessionId;
    $("agentTag").textContent = "agent: " + agentId;
    document.body.classList.remove("guard-off");
    watchEvents();
  } catch (e) { log("error", e.message); }
}
async function sendInput() {
  if (!sessionId) { log("error", "先新建/恢复会话"); return; }
  const content = $("input").value.trim();
  if (!content) return;
  $("input").value = "";
  log("user", content);
  try {
    const res = await api("agent.send_input",
      { session_id: sessionId, agent_id: agentId, content, input_trust: "trusted" });
    log("runtime", `回合已受理 op=${res.operation_id} state=${res.state}`);
    pollOp(res.operation_id);
  } catch (e) { log("error", e.message); }
}
async function pollOp(opId, tries = 300) {
  for (let i = 0; i < tries; i++) {
    try {
      const r = await api("operations.get", { operation_id: opId });
      if (["succeeded", "failed", "cancelled", "timeout"].includes(r.state)) {
        if (r.state === "succeeded" && r.result_reference === null) { /* 内容经事件流 */ }
        log(r.state === "succeeded" ? "runtime" : "error",
            `op 终态: ${r.state}${r.error ? " · " + r.error.message : ""}`);
        return;
      }
    } catch (e) { /* 继续轮询 */ }
    await new Promise((res) => setTimeout(res, 200));
  }
}
async function watchEvents() {
  // M8 体验修复:事件流改走合同方法 events.poll 轮询——EventSource 无法
  // 携带 Authorization 头,被鉴权中间件 401 静默拒绝
  if (watchEvents.timer) clearInterval(watchEvents.timer);
  watchEvents.timer = setInterval(async () => {
    if (!sessionId) return;
    try {
      const res = await api("events.poll",
        { session_id: sessionId, since_seq: lastSeq });
      for (const e of res.events || []) {
        lastSeq = e.event_seq || lastSeq;
        const ty = e.type, p = e.payload || {}; // 信封 JSON 字段名是 type
        if (ty === "model.content.delta") {
          // M9-S2 真流式:增量逐块追加到在途回答(流式渲染;textContent 防 XSS)
          streamDelta(p.operation_id, p.delta || "");
        } else if (ty === "model.invocation.completed" && p.content) {
          // 终态落地:清在途流式缓冲,以完整内容为准
          finishStream(p.operation_id);
          log("assistant", p.content);
        } else if (ty === "model.invocation.failed") {
          finishStream(p.operation_id);
          log("error", "模型调用失败:" + (p.error_code || "?"));
        } else if (ty === "operation.state.changed" && p.to === "failed") {
          log("error", "回合失败:" + (p.reason_code || ""));
        } else if (ty === "agent.turn.started") {
          log("runtime", "思考中…");
        }
      }
    } catch (e) { /* 下一轮重试 */ }
  }, 1500);
}

async function health() {
  const c = cfg(); const base = c.base || location.origin;
  const r = await fetch(`${base}/health`);
  log("runtime", `/health → ${r.status}`);
}
async function loadApprovals() {
  try {
    const res = await api("approval.list", {});
    const ul = $("approvals"); ul.innerHTML = "";
    (res.approvals || []).filter((a) => a.state === "waiting_user").forEach((a) => {
      const li = document.createElement("li");
      const tag = document.createElement("span"); tag.className = "tag";
      tag.textContent = a.risk_class;
      const name = document.createElement("b"); name.textContent = a.capability;
      const spacer = document.createElement("span"); spacer.style.flex = "1";
      const yes = document.createElement("button"); yes.className = "p"; yes.textContent = "批准";
      const no = document.createElement("button"); no.textContent = "拒绝";
      yes.onclick = async () => {
        await api("approval.respond", { approval_id: a.approval_id, decision: "approve", scope: "once" });
        loadApprovals();
      };
      no.onclick = async () => {
        await api("approval.respond", { approval_id: a.approval_id, decision: "deny", scope: null });
        loadApprovals();
      };
      li.append(tag, name, spacer, yes, no);
      ul.appendChild(li);
    });
    if (!(res.approvals || []).some((a) => a.state === "waiting_user"))
      ul.innerHTML = "<li class='tag'>队列空</li>";
  } catch (e) { /* 静默重试 */ }
}
async function loadTasks() {
  try {
    const res = await api("task.list", {});
    const ul = $("tasks"); ul.innerHTML = "";
    (res.tasks || []).forEach((t) => {
      const li = document.createElement("li");
      const tag = document.createElement("span"); tag.className = "tag";
      tag.textContent = t.state;
      const label = document.createElement("span");
      label.textContent = t.title || t.task_id; // 任务标题为用户输入,禁止 HTML 拼接
      li.append(tag, label);
      ul.appendChild(li);
    });
    if (!(res.tasks || []).length) ul.innerHTML = "<li class='tag'>暂无任务</li>";
  } catch (e) { /* 静默 */ }
}
conn();

// 对话式输入:Enter 直接发送(原版仅按钮触发;shift+enter 换行预留)
$("input").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); sendInput(); }
});

/* ===== 主题三态(浅/深/跟随系统)===== */
(function () {
  const row = $("themeRow");
  function paint() {
    const cur = localStorage.getItem("bm.theme") || "auto";
    for (const b of row.children) b.setAttribute("aria-pressed", String(b.dataset.t === cur));
  }
  row.addEventListener("click", (ev) => {
    const b = ev.target.closest("button[data-t]");
    if (!b) return;
    localStorage.setItem("bm.theme", b.dataset.t);
    applyTheme(b.dataset.t);
    paint();
  });
  applyTheme(localStorage.getItem("bm.theme") || "auto");
  paint();
})();
function applyTheme(t) {
  const dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  applyTheme(localStorage.getItem("bm.theme") || "auto");
});

/* ===== 前端界面插槽(2026-08-30 方案,PENDING D-M3-1)=====
 * 声明即授权(参照 dsh ui-slots 模式):只允许向下方 DECLARED 集合里
 * 声明过的插槽注册节点;主题换肤走 tokens.css 的 --bm-* 变量,外观类
 * 插件零 JS 也可工作。功能类面板的数据一律走后端权限合同(ADR-0006),
 * 插槽机制本身不提供任何后端能力。 */
window.boenmind = (function () {
  const DECLARED = new Set(["sidebar-extra", "composer-tools", "guard-extra"]);
  const nodes = new Map(); // id -> {slot, node, order}
  function render(slot) {
    const host = document.querySelector(`[data-slot="${slot}"]`);
    if (!host) return;
    host.replaceChildren();
    [...nodes.values()]
      .filter((n) => n.slot === slot)
      .sort((a, b) => (a.order || 0) - (b.order || 0))
      .forEach((n) => host.appendChild(n.node));
  }
  return {
    declared: [...DECLARED],
    register(spec) { // {slot, id, node, order};node 必须是 DOM 节点,拒绝 HTML 字符串(防注入)
      if (!DECLARED.has(spec.slot)) {
        console.warn(`[boenmind] 插槽 "${spec.slot}" 未声明,拒绝注册。可插:${[...DECLARED].join(", ")}`);
        return false;
      }
      if (!(spec.node instanceof Node)) {
        console.warn("[boenmind] register 需要 DOM 节点(node instanceof Node),不接受字符串。");
        return false;
      }
      nodes.set(spec.id, spec);
      render(spec.slot);
      return true;
    },
    unregister(id) {
      const n = nodes.get(id);
      if (n) { nodes.delete(id); render(n.slot); }
    },
    setTheme: applyTheme
  };
})();
</script>
