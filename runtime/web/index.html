<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BoenMind 控制台</title>
<style>
  :root { --bg:#0f1420; --panel:#1a2233; --line:#2a3550; --fg:#e6ecff; --dim:#8fa0c5; --acc:#5b8cff; --ok:#3ecf8e; --err:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui,"Segoe UI",sans-serif; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; }
  header h1 { font-size:16px; margin:0; }
  header input { flex:0 1 340px; }
  main { display:grid; grid-template-columns: 1.4fr 1fr; gap:12px; padding:12px 16px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  h2 { font-size:13px; margin:0 0 8px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; }
  input, button, select { background:#0c111c; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:inherit; }
  button { cursor:pointer; } button:hover { border-color:var(--acc); } button.p { background:var(--acc); border-color:var(--acc); color:#fff; }
  .row { display:flex; gap:8px; margin:6px 0; flex-wrap:wrap; }
  #log { height:340px; overflow:auto; background:#0c111c; border:1px solid var(--line); border-radius:6px; padding:8px; font:12px/1.5 Consolas,monospace; }
  .msg { margin:2px 0; } .msg .who { color:var(--acc); } .msg .who.sys { color:var(--dim); }
  ul { list-style:none; margin:0; padding:0; }
  li { padding:6px 8px; border:1px solid var(--line); border-radius:6px; margin:4px 0; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .tag { font-size:11px; padding:1px 8px; border-radius:10px; background:#0c111c; color:var(--dim); }
  .ok { color:var(--ok); } .err { color:var(--err); }
  label.cfg { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>BoenMind</h1>
  <input id="base" placeholder="server 地址(缺省同源)">
  <input id="token" placeholder="访问令牌(auth.v0_1)">
  <button onclick="saveCfg()">连接</button>
  <span id="conn" class="tag">未连接</span>
</header>
<main>
  <section>
    <h2>会话</h2>
    <div class="row">
      <input id="agentName" placeholder="agent 名称" value="assistant">
      <button class="p" onclick="createSession()">新建会话</button>
      <button onclick="health()">健康检查</button>
    </div>
    <div class="row">
      <input id="input" placeholder="输入内容(trusted)" style="flex:1 1 300px">
      <button class="p" onclick="sendInput()">发送回合</button>
    </div>
    <div id="log"></div>
  </section>
  <div>
    <section>
      <h2>审批队列</h2>
      <ul id="approvals"></ul>
      <div class="row"><button onclick="loadApprovals()">刷新</button></div>
    </section>
    <section style="margin-top:12px">
      <h2>任务看板</h2>
      <ul id="tasks"></ul>
      <div class="row"><button onclick="loadTasks()">刷新</button></div>
    </section>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let sessionId = "", agentId = "", lastSeq = 0, pollTimer = null;

function saveCfg() {
  localStorage.setItem("bm.base", $("base").value.trim());
  localStorage.setItem("bm.token", $("token").value.trim());
  conn();
}
function cfg() {
  return {
    base: localStorage.getItem("bm.base") || "",
    token: localStorage.getItem("bm.token") || ""
  };
}
function conn() {
  const c = cfg();
  $("base").value = c.base; $("token").value = c.token;
  api("operations.get", { operation_id: "op_00000000000000000000000000" })
    .then(() => $("conn").textContent = "已连接")
    .catch(() => $("conn").textContent = "未连接(检查地址/令牌)");
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(loadApprovals, 3000);
  loadApprovals(); loadTasks();
}
async function api(method, params) {
  const c = cfg();
  const base = c.base || location.origin;
  const r = await fetch(`${base}/rpc/${method}`, {
    method: "POST",
    headers: Object.assign({ "Content-Type": "application/json" },
      c.token ? { Authorization: `Bearer ${c.token}` } : {}),
    body: JSON.stringify({ v: "0.1", method, request_id: rid(), params })
  });
  const body = await r.json();
  if (!body.ok) throw new Error(body.error ? `${body.error.code}: ${body.error.message}` : "HTTP " + r.status);
  return body.result;
}
function rid() {
  let s = "req_";
  for (let i = 0; i < 26; i++) s += "0123456789ABCDEFGHJKMNPQRSTVWXYZ"[Math.floor(Math.random() * 32)];
  return s;
}
function log(who, text) {
  const d = document.createElement("div");
  d.className = "msg";
  d.innerHTML = `<span class="who ${who === "runtime" ? "sys" : ""}">${who}</span> ${String(text).replace(/</g, "&lt;")}`;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
}
async function createSession() {
  try {
    const res = await api("session.create", {
      agent: { name: $("agentName").value || "assistant",
               model_chain: ["gpt-5.6-luna"],
               budget: { max_tokens: 200000, max_turns: 20 } }
    });
    sessionId = res.session_id; agentId = res.agent_id;
    log("runtime", `会话已创建 ${sessionId}(agent ${agentId})`);
    watchEvents();
  } catch (e) { log("error", e.message); }
}
async function sendInput() {
  if (!sessionId) { log("error", "先新建/恢复会话"); return; }
  const content = $("input").value.trim();
  if (!content) return;
  $("input").value = "";
  log("user", content);
  try {
    const res = await api("agent.send_input",
      { session_id: sessionId, agent_id: agentId, content, input_trust: "trusted" });
    log("runtime", `回合已受理 op=${res.operation_id} state=${res.state}`);
    pollOp(res.operation_id);
  } catch (e) { log("error", e.message); }
}
async function pollOp(opId, tries = 300) {
  for (let i = 0; i < tries; i++) {
    try {
      const r = await api("operations.get", { operation_id: opId });
      if (["succeeded", "failed", "cancelled", "timeout"].includes(r.state)) {
        if (r.state === "succeeded" && r.result_reference === null) { /* 内容经事件流 */ }
        log(r.state === "succeeded" ? "runtime" : "error",
            `op 终态: ${r.state}${r.error ? " · " + r.error.message : ""}`);
        return;
      }
    } catch (e) { /* 继续轮询 */ }
    await new Promise((res) => setTimeout(res, 200));
  }
}
async function watchEvents() {
  const c = cfg(); const base = c.base || location.origin;
  const es = new EventSource(`${base}/events/${sessionId}?since_seq=${lastSeq}`);
  es.onmessage = (m) => {
    try {
      const e = JSON.parse(m.data);
      lastSeq = e.event_seq || lastSeq;
      if (e.event_type === "agent.completed" || e.event_type === "model.invocation.completed") {
        log("runtime", `${e.event_type} (seq ${e.event_seq})`);
      }
    } catch (_) { /* 忽略非 JSON */ }
  };
  es.onerror = () => es.close();
}
async function health() {
  const c = cfg(); const base = c.base || location.origin;
  const r = await fetch(`${base}/health`);
  log("runtime", `/health → ${r.status}`);
}
async function loadApprovals() {
  try {
    const res = await api("approval.list", {});
    const ul = $("approvals"); ul.innerHTML = "";
    (res.approvals || []).filter((a) => a.state === "waiting_user").forEach((a) => {
      const li = document.createElement("li");
      li.innerHTML = `<span class="tag">${a.risk_class}</span> <b>${a.capability}</b>
        <span style="flex:1"></span>
        <button class="p">批准</button><button>拒绝</button>`;
      li.children[2].onclick = async () => {
        await api("approval.respond", { approval_id: a.approval_id, decision: "approve", scope: "once" });
        loadApprovals();
      };
      li.children[3].onclick = async () => {
        await api("approval.respond", { approval_id: a.approval_id, decision: "deny", scope: null });
        loadApprovals();
      };
      ul.appendChild(li);
    });
    if (!(res.approvals || []).some((a) => a.state === "waiting_user"))
      ul.innerHTML = "<li class='tag'>队列空</li>";
  } catch (e) { /* 静默重试 */ }
}
async function loadTasks() {
  try {
    const res = await api("task.list", {});
    const ul = $("tasks"); ul.innerHTML = "";
    (res.tasks || []).forEach((t) => {
      const li = document.createElement("li");
      li.innerHTML = `<span class="tag">${t.state}</span> ${t.title || t.task_id}`;
      ul.appendChild(li);
    });
    if (!(res.tasks || []).length) ul.innerHTML = "<li class='tag'>暂无任务</li>";
  } catch (e) { /* 静默 */ }
}
conn();
</script>
</body>
</html>
