<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BoenMind CLI 终端</title>
<link rel="stylesheet" href="tokens.css">
<script>
(function () {
  var t = localStorage.getItem("bm.theme") || "auto";
  var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
})();
</script>
<style>
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; display:flex; flex-direction:column;
    background:var(--bm-alias-bg-base); color:var(--bm-alias-label-primary);
    font:13px/1.55 var(--bm-font-family-code);
  }
  header {
    padding:10px 16px; border-bottom:1px solid var(--bm-alias-border-l1);
    display:flex; gap:12px; align-items:center;
    background:var(--bm-specific-sidebar-fill);
  }
  header b { color:var(--bm-alias-label-primary); font-weight:500; }
  header span { color:var(--bm-alias-label-tertiary); font-size:12px; }
  header a { color:var(--bm-alias-label-secondary); font-size:12px; text-decoration:none; }
  header a:hover { color:var(--bm-alias-button-info-fill); }
  #tok { margin-left:auto; display:flex; align-items:center; gap:6px; }
  #token {
    background:var(--bm-specific-login-input); color:var(--bm-alias-label-secondary);
    border:1px solid var(--bm-alias-border-l1); border-radius:8px;
    font:inherit; padding:5px 9px; width:320px;
  }
  #token:focus { border-color:var(--bm-alias-button-info-fill); outline:0; }
  #term {
    flex:1; overflow-y:auto; padding:12px 16px; white-space:pre-wrap; word-break:break-all;
    scrollbar-width:thin; scrollbar-color:var(--bm-alias-scrollbar-bg-l1) transparent;
  }
  .cmd { color:var(--bm-alias-label-primary); } .cmd::before { content:"$ "; color:var(--bm-alias-label-tertiary); }
  .out { color:var(--bm-alias-label-secondary); }
  .err { color:var(--bm-alias-state-error-primary); }
  .sys { color:var(--bm-alias-label-tertiary); }
  #line {
    display:flex; border-top:1px solid var(--bm-alias-border-l1); align-items:center;
    background:var(--bm-specific-sidebar-fill);
  }
  #line .ps { color:var(--bm-alias-state-success-primary); padding:10px 0 10px 16px; }
  #cmdin { flex:1; background:transparent; border:0; outline:0; color:var(--bm-alias-label-primary); font:inherit; padding:10px; }
</style>
</head>
<body>
<header>
  <b>BoenMind CLI</b>
  <span>危险操作会走审批流 · 需 BOEN_CLI_WEB=1</span>
  <a href="/">← 控制台</a>
  <span id="tok">令牌:<input id="token" type="password"></span>
</header>
<div id="term"><div class="sys">BoenMind CLI 终端(命令经服务器转发给 boenmind CLI;--url/--token 自动注入)。</div><div class="sys">试试:session create --name demo   |   capability call system.echo --args "{\"msg\":\"hi\"}"</div></div>
<div id="line"><span class="ps">boenmind&gt;</span><input id="cmdin" autofocus autocomplete="off"></div>
<script>
const $ = (id) => document.getElementById(id);
const term = $("term"), cmdin = $("cmdin");
$("token").value = localStorage.getItem("bm.token") || "";
let history = JSON.parse(localStorage.getItem("cli.history") || "[]");
let hi = history.length;

function append(cls, text) {
  const d = document.createElement("div");
  d.className = cls;
  d.textContent = text;
  term.appendChild(d);
  term.scrollTop = term.scrollHeight;
}

async function run(cmd) {
  append("cmd", cmd);
  try {
    const token = $("token").value.trim();
    const r = await fetch("/admin/cli", {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json" },
        token ? { Authorization: "Bearer " + token } : {}),
      body: JSON.stringify({ cmd })
    });
    const text = await r.text();
    if (r.status !== 200) { append("err", `[HTTP ${r.status}] ${text}`); return; }
    const body = JSON.parse(text);
    if (body.stdout) append("out", body.stdout.trimEnd());
    if (body.stderr) append("err", body.stderr.trimEnd());
    append(body.exit_code === 0 ? "sys" : "err",
      `[退出码 ${body.exit_code}]`);
    localStorage.setItem("bm.token", token);
  } catch (e) { append("err", String(e)); }
}

cmdin.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter") {
    const cmd = cmdin.value.trim();
    if (!cmd) return;
    history.push(cmd); hi = history.length;
    localStorage.setItem("cli.history", JSON.stringify(history.slice(-50)));
    cmdin.value = "";
    run(cmd);
  } else if (ev.key === "ArrowUp") {
    if (hi > 0) { hi -= 1; cmdin.value = history[hi] || ""; }
    ev.preventDefault();
  } else if (ev.key === "ArrowDown") {
    if (hi < history.length - 1) { hi += 1; cmdin.value = history[hi] || ""; }
    else { hi = history.length; cmdin.value = ""; }
    ev.preventDefault();
  }
});
</script>
</body>
</html>
