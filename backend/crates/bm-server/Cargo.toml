[package]
name = "bm-server"
version = "0.1.1"
edition = "2024"
description = "BoenMind backend API server (axum + SSE)"

[features]
# 服务器版：把前端构建产物（frontend/dist）与内置插件（backend/plugins）
# 内嵌进二进制，自包含单文件部署。桌面壳（Tauri）构建不启用此 feature。
embed = ["dep:rust-embed", "bm-core/embed-plugins"]

[[bin]]
name = "bm-server"
path = "src/main.rs"

[dependencies]
bm-core = { path = "../bm-core" }
pi = { workspace = true }
axum = "0.8"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tokio-stream = "0.1.19"
mime_guess = "2"
rust-embed = { version = "8", optional = true }
