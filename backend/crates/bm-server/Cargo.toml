[package]
name = "bm-server"
version = "0.1.0"
edition = "2024"
description = "BoenMind backend API server (axum + SSE)"

[[bin]]
name = "bm-server"
path = "src/main.rs"

[dependencies]
bm-core = { path = "../bm-core" }
pi = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
futures-core = "0.3"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tokio-stream = "0.1.19"
