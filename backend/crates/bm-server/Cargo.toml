[package]
name = "bm-server"
version = "0.1.3"
edition = "2024"
description = "BoenMind backend API server (axum + SSE)"

[features]
# 服务器版：把前端构建产物（frontend/dist）与内置插件（backend/plugins）
# 内嵌进二进制，自包含单文件部署。桌面壳（Tauri）构建不启用此 feature。
embed = ["dep:rust-embed", "bm-core/embed-plugins"]
# 仅内嵌内置插件（backend/plugins），不内嵌前端。桌面版（Windows/macOS 便携包
# 与热升级 runtime）启用：用户机器上没有仓库路径，普通构建的"从仓库复制"
# 预装会静默失败（编译机路径在运行时不存在），只能靠二进制内嵌。
embed-plugins = ["bm-core/embed-plugins"]

[[bin]]
name = "bm-server"
path = "src/main.rs"

[dependencies]
bm-core = { path = "../bm-core" }
# 阶段 0 双写：事件日志（万物皆插件架构最小内核）
bm-protocol = { workspace = true }
bm-kernel = { workspace = true }
bm-storage-turso = { workspace = true }
# A6 接线：自研 ReactLoopAgent（BM_LOOP_ENGINE=bm 时替代 pi loop）
bm-loop = { path = "../bm-loop" }
# B4 工具方向：vendored QuickJS 引擎（bm 引擎的插件工具执行侧）
bm-compat = { path = "../bm-compat" }
# 压缩插件（默认实现，D10）：组装层挂进 LoopConfig.compactor（v0.17 越界修正）
bm-compactor = { path = "../bm-compactor" }
# 记忆插件（§6.1 最小实现）：StreamHooks 组合，on_request 注入 facts.md
bm-memory = { path = "../bm-memory" }
bm-mcp = { path = "../bm-mcp" }
# WIKI 应用引擎（xu-wiki 迁移 Rust 重写）：Page/LRU 关系/检索 + REST 面
bm-wiki = { path = "../bm-wiki" }
axum = "0.8"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.22"
# request/header 的 prompt_hash 审计锚点（A2）
sha2 = "0.10"
# 终端面板（TerminalPane 一期，上游吸收 T2）：跨平台 pty（Windows ConPTY），
# blocking API 用读线程包裹——见 backend/vendor/UPSTREAM_TRACKING.md T2
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
mime_guess = "2"
# pdf-omni 插件核心：MinerU/LlamaParse 云端解析编排
# reqwest — 流式 PUT/multipart 上传与轮询（rustls，无 openssl）
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
# lopdf — 纯 Rust PDF 操作：页数/切分/提取/2×2 拼页（pypdf 的替代）
lopdf = "0.40"
# zip — MinerU 结果包解压（flate2 只管 gzip，zip 容器由本 crate 解析）
zip = { version = "2", default-features = false, features = ["deflate"] }
# image — 级联桶1：表格截图按原尺寸拼 A4 画布（Pillow 的替代，裁剪默认特性）
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# verify 交叉验证的正则统计（轻量，无 regex 的全部特性）
fancy-regex = "0.14"
# 内置工具集（B6）：write/edit 原子落盘（tempfile rename，对齐 pi 语义）
tempfile = "3"
# 内置工具集（B6）：grep/find/glob 递归遍历尊重 .gitignore/.ignore（ripgrep 库族，
# M1 验收问题 2——纯 std 递归会趟 target/ 数万文件卡 ~4 分钟）
ignore = "0.4"
# 内置工具集：glob 模式匹配（globset 已是 ignore 的传递依赖，显式声明直接使用）
globset = "0.4"
rust-embed = { version = "8", optional = true }

[dev-dependencies]
bm-mcp = { path = "../bm-mcp" }
