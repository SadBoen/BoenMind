[package]
name = "bm-compat"
version = "0.1.0"
edition = "2024"
description = "pi-compat：vendored QuickJS 引擎作库（pi.dev 插件当日兼容的兼容层，主线 B）"
# B2 完成后本 crate 已入 backend/ workspace members（B1 时曾以独立 [workspace]
# 表维持 standalone 构建，入 workspace 后该表移除、Cargo.lock 由 workspace 统一）。

[dependencies]
# Async runtime（pi_agent_rust 同款；B2 host 线程会用到）
tokio = { version = "1", features = ["full"] }
# async trait objects（pi_agent_rust 同版本；B2 HostServices 端口）
async-trait = "0.1"
# error.rs 的 LockError From impl（pi_agent_rust 同版本同 features）
asupersync = { version = "0.3.9", default-features = false, features = ["tls-webpki-roots", "test-internals"] }
# extensions_js.rs:4629 dirs::home_dir()
dirs = "6"
# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
# QuickJS 引擎 + swc TS 剥离（extensions_js.rs 核心路径）
rquickjs = { version = "0.11", features = ["futures", "loader"] }
swc_common = "18.0.1"
swc_ecma_codegen = "23.0.0"
swc_ecma_ast = "20.0.1"
swc_ecma_parser = "34.0.0"
swc_ecma_transforms_base = "37.0.0"
swc_ecma_transforms_typescript = "41.0.0"
# Utilities
base64 = "0.22"
flate2 = "1.1.9"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12.2", features = ["hmac"] }
scrypt = { version = "0.11.0", default-features = false }
getrandom = "0.4.1"
regex = "1.12.3"
ring = "0.17.14"
uuid = { version = "1.21.0", features = ["v4"] }
crossbeam-queue = "0.3"
thiserror = "2"
sysinfo = "0.39.6"
# 日志（scheduler/extensions_js/hostcall_queue/crypto_shim 均用 tracing::）
tracing = "0.1"
# error.rs Sqlite variant 依赖
sqlmodel-core = "0.2.2"
# wasm-host（默认关；pi_wasm.rs 拷入后启用）
wasmtime = { version = "47.0.3", features = ["component-model"], optional = true }

[build-dependencies]
crc32c = "0.6.8"
flate2 = "1.1.9"

[features]
default = []
wasm-host = ["dep:wasmtime"]
# extensions_js.rs:140 cfg!(feature = "ext-conformance")（pi_agent_rust 同名 feature）
ext-conformance = []

[dev-dependencies]
# B1 拷入时上游 dev-dependencies 丢失（error.rs 的 proptest_error 测试模块、
# extensions_js.rs 测试用 futures/tempfile、crc32c 构建依赖测试用）——
# cargo test -p bm-compat 此前一直编译失败；补回使本 crate 测试可跑
proptest = "1"
futures = "0.3"
tempfile = "3"
crc32c = "0.6.8"

# B1 拷入 6 文件（45K 行）与 verbatim shim 的调用面尚未全部接线（B3 加载路径、
# B4 内核接线完成后自然消解）。红线：拷贝文件逐字节一致、不可为消 lint 改动。
# 故在 manifest 层放行这三类存量 lint，B3/B4 落地后收紧为 deny/forbid。
# unsafe_code 对齐 pi_agent_rust@44ddf80/Cargo.toml 纪律。
[lints.rust]
dead_code = "allow"
unused_imports = "allow"
unsafe_code = "forbid"

[lints.clippy]
collapsible_if = "allow"
