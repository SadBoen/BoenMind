[package]
name = "bm-core"
version = "0.1.1"
edition = "2024"
description = "BoenMind domain layer: config, sessions, workspace files, agent wrapper"

[features]
# 服务器版（embed）预装内置插件：把 backend/plugins 内嵌进二进制，
# 部署机没有仓库路径时仍能写出官方插件（见 plugins.rs）
embed-plugins = ["dep:rust-embed"]

[dependencies]
pi = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
# SQLite 兼容存储：Turso（limbo，Rust 重写，原生向量 + tantivy FTS）。
# 裁剪默认的 fts（tantivy）特性以减小构建体积，后续做全文搜索时再开启。
turso = { version = "0.7.2", default-features = false, features = ["mimalloc"] }
# skills 安装/浏览：HTTP 抓取 + tarball 解压 + 随机抽取
ureq = { version = "3", features = ["json", "gzip"] }
# 提供商端点校验（SSRF 防护：解析 URL 并检查网络目标）
url = "2"
flate2 = "1"
tar = "0.4"
rand = "0.8"
# embed-plugins feature：内置插件目录内嵌（服务器版预装）
rust-embed = { version = "8", optional = true }

[dev-dependencies]
# db.rs 单测需要 tokio runtime（正常依赖只开 sync）
tokio = { version = "1", features = ["rt", "macros"] }
