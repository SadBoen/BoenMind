[package]
name = "bm-core"
version = "0.1.0"
edition = "2024"
description = "BoenMind domain layer: config, sessions, workspace files, agent wrapper"

[dependencies]
pi = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
rusqlite = { version = "0.39", features = ["bundled"] }
