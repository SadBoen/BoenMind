[package]
name = "bm-mcp"
version = "0.1.0"
edition = "2024"
description = "BoenMind 默认官方 MCP 插件：MCP client（协议 2026-07-28 + legacy dual-era 兼容）"

[dependencies]
bm-protocol = { workspace = true }
rmcp = { version = "3.1", default-features = false, features = [
    "client",
    "reqwest", # streamable-http 的 rustls TLS（纯 Rust，三平台通用）
    "transport-child-process", # stdio：spawn 子进程
    "transport-streamable-http-client-reqwest", # streamable HTTP client
] }
tokio = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
