[package]
name = "bm-wiki"
version = "0.1.0"
edition = "2024"
description = "WIKI 应用引擎（xu-wiki 迁移，Rust 重写）：Page/List/Report/Entity 四类节点 + 50 边 LRU 关系 + 关键词检索打分，纯 .md+YAML frontmatter 存储，格式与 xu-wiki 兼容"

[dependencies]
ignore = "0.4"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tracing = "0.1"
