[package]
name = "bm-event-log-tests"
version = "0.1.0"
edition = "2024"
publish = false
description = "BoenMind 事件日志集成测试套件（replay 确定性/ignorable 守卫/fork 分支/checkpoint 恢复）"

[dependencies]
bm-protocol = { workspace = true }
bm-kernel = { workspace = true }
bm-storage-turso = { workspace = true }
serde_json = "1"
# ignorable_guard 测试直接操作 DB 注入"未来版本"行
turso = { version = "0.7.2", default-features = false, features = ["mimalloc"] }
tokio = { version = "1", features = ["macros", "rt"] }
# proptest 承诺（实现方案 §6）：append/replay 一致性属性测试
proptest = "1"
