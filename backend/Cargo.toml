[workspace]
resolver = "3"
members = [
    "crates/bm-core",
    "crates/bm-server",
    "crates/bm-protocol",
    "crates/bm-kernel",
    "crates/bm-storage-turso",
    "crates/bm-loop",
    "crates/bm-compat",
    "crates/bm-compactor",
    "crates/bm-memory",
    "tests/event_log",
]

# asupersync vendor 化：pi 引擎的底层异步运行时（唯一存活 vendored 依赖），本地补丁见
# backend/vendor/UPSTREAM_PATCHES.md「asupersync」区。
[patch.crates-io]
asupersync = { path = "vendor/asupersync" }

# BoenMind 2.0 内核三件套（万物皆插件架构阶段 0，见 docs/kernel-implementation-plan.md）
[workspace.dependencies]
bm-protocol = { path = "crates/bm-protocol" }
bm-kernel = { path = "crates/bm-kernel" }
bm-storage-turso = { path = "crates/bm-storage-turso" }
tokio = { version = "1", features = ["full"] }

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
