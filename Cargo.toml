# BoenMind 产品层 workspace（组合根 + 最终程序 + Rust 插件 + QuickJS 桥）。
#
# 分层（依赖只许向下）：
#   kernel-contracts / kernel-session / kernel-storage / kernel-supervisor  ← kernel/ 子模块（纯内核库）
#   bm/ports         ← 产品级契约层（核心插件需要的内核扩展端口，如 Compactor）
#   plugins/*        ← 产品插件（独立 crate，只依赖 kernel-contracts / kernel-session / bm-ports）
#   bm/assembly      ← 组合根（唯一装配点：把插件 + 内核端口拧成 Runtime）
#   bm/web-server / bm/headless ← 最终程序（只消费 bm-assembly::assemble，不做装配）
#   bm/quickjs-bridge ← QuickJS 宿主桥（产品层，host API 走内核契约端口）
[workspace]
resolver = "2"
members = [
    "bm/assembly",
    "bm/web-server",
    "bm/headless",
    "bm/quickjs-bridge",
    "bm/ports",
    "bm/host-fs",
    "plugins/plugin-llm",
    "plugins/plugin-loop",
    "plugins/plugin-tools",
    "plugins/plugin-host-tools",
    "plugins/plugin-auth",
    "plugins/plugin-compactor",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# 全仓统一 lint（2026-08-20 收口）：deny 级 = 正确性/可维护性硬约束，
# 由 `cargo clippy --workspace` 强制（CI 即 clippy 无警告）。
# 新 crate 自动继承本段；局部豁免用 #[allow(...)]（罕见）。
[workspace.lints.rust]
# 未使用代码/变量/import——发布级质量门槛。
unused = "deny"

[workspace.lints.clippy]
# 错误处理一致性：unwrap/expect 在测试与合法断言中大量使用，全面清理是
# 独立任务（TODO: unwrap-polish）；先不设警示噪音，保持 clippy 干净基线。
unwrap_used = "allow"
expect_used = "allow"
# 集合索引越界 panic 风险（产品路径禁止裸索引；测试可豁免）。
indexing_slicing = "allow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
sha2 = "0.10"
subtle = "2"
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
lto = "thin"
