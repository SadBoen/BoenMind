<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BoenMind Surface</title>
<style>
  :root { --bg: #0f1115; --panel: #171a21; --line: #2a2f3a; --fg: #e6e9ef; --dim: #8b93a3; --acc: #5b8cff; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--fg); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header input { background: var(--bg); color: var(--fg); border: 1px solid var(--line); padding: 6px 8px; border-radius: 6px; }
  #url { width: 220px; } #token { width: 260px; }
  header .spacer { flex: 1; }
  #state { font-size: 12px; color: var(--dim); }
  main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 72%; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-end; background: #2b4a9e; }
  .bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
  .sys { align-self: center; color: var(--dim); font-size: 12px; }
  footer { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); background: var(--panel); }
  #input { flex: 1; background: var(--bg); color: var(--fg); border: 1px solid var(--line); padding: 10px; border-radius: 8px; }
  button { background: var(--acc); color: #fff; border: 0; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .sid { font-size: 12px; color: var(--dim); }
</style>
</head>
<body>
<header>
  <input id="url" placeholder="服务地址" value="http://127.0.0.1:7531">
  <input id="token" placeholder="访问令牌(存于 data-dir/token)" type="password">
  <span class="spacer"></span>
  <span class="sid" id="sid"></span>
  <button id="newSession">新会话</button>
  <span id="state">未连接</span>
</header>
<main id="log"><div class="sys">填写服务地址与令牌后,点击「新会话」开始。</div></main>
<footer>
  <input id="input" placeholder="输入内容,Enter 发送" disabled>
  <button id="send" disabled>发送</button>
</footer>
<script src="app.js"></script>
</body>
</html>
