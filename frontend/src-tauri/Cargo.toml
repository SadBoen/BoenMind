[package]
name = "boenmind-desktop"
version = "0.1.4"
description = "BoenMind 桌面壳：无边框窗口 + 内嵌 web-server 后端 + 应用内热更新"
authors = ["boen"]
license = "MIT"
edition = "2021"

# 独立工程：不并入主 workspace（主 workspace 的 bm/ 是内核协议层，
# Tauri 壳作为独立桌面壳 Cargo 工程，避免被主 workspace lints 约束）。
[workspace]

[lib]
name = "boenmind_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
time = { version = "0.3", features = ["formatting"] }