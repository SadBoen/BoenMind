[package]
name = "boenmind-desktop"
version = "0.1.4"
description = "BoenMind 桌面壳：无边框窗口 + 内嵌 web-server 后端 + 应用内热更新"
authors = ["boen"]
license = "MIT"
edition = "2021"

[lib]
name = "boenmind_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"