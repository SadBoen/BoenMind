[package]
name = "app"
version = "0.1.1"
description = "BoenMind 桌面壳：内嵌启动 bm-server 后端，承载 React 前端"
authors = ["boen"]
license = "MIT"
edition = "2024"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
bm-server = { path = "../../backend/crates/bm-server" }
