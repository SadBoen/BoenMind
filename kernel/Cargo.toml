[workspace]
resolver = "2"
members = [
    "kernel-contracts",
    "kernel-session",
    "kernel-llm",
    "kernel-tools",
    "kernel-storage",
    "kernel-loop",
    "kernel-supervisor",
    "kernel-assembly",
    "headless",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"

[profile.release]
lto = "thin"
